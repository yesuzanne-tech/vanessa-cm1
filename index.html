/* ---------- Progression ---------- */
function statsPour(g) {
  var n = 0, somme = 0, dernier = null;
  for (var i = 0; i < state.history.length; i++) {
    var e = state.history[i];
    if (e.g === g && e.k !== "test" && typeof e.s === "number") { n++; somme += e.s; dernier = e.s; }
  }
  return { n: n, moy: n ? somme / n : 0, dernier: dernier };
}

/* ---------- Journal détaillé des exercices ---------- */
var LOG_MAX = 25;
function cutTxt(t, n) { t = String(t == null ? "" : t); return t.length > n ? t.slice(0, n - 1) + "…" : t; }
function heureNow() { var d = new Date(), m = d.getMinutes(); return d.getHours() + " h " + (m < 10 ? "0" + m : m); }
function noteRep(q, i, ok) {
  if (!cur.rep) { cur.rep = []; }
  cur.rep.push({ q: cutTxt(q.q, 140), r: cutTxt(q.o[i], 90), b: cutTxt(q.o[q.a], 90), ok: ok ? 1 : 0 });
}
function logExercice(e) {
  if (!state.log) { state.log = []; }
  state.log.push(e);
  if (state.log.length > LOG_MAX) { state.log = state.log.slice(state.log.length - LOG_MAX); }
}
function ligneRep(x) {
  return '<div class="rep">' + (x.ok ? "✅" : "❌") + ' <strong>' + esc(x.q) + '</strong><br><span class="petit">Réponse de Vanessa : ' + esc(x.r) + (x.ok ? "" : ' · Bonne réponse : ' + esc(x.b)) + '</span></div>';
}
function detailExerciceTout(e) {
  var h = '<div class="petit">' + esc(e.d) + (e.h ? " à " + esc(e.h) : "") + ' · ' + e.ok + ' bonne' + (e.ok > 1 ? "s" : "") + ' réponse' + (e.ok > 1 ? "s" : "") + ' sur ' + e.n + ' (note ' + e.s + '/10)</div>';
  for (var i = 0; i < (e.qs || []).length; i++) { h += ligneRep(e.qs[i]); }
  if (e.w && String(e.w).replace(/\s+/g, "")) { h += '<div class="rep">✏️ <strong>' + esc(e.qe || "Réponse écrite") + '</strong><br><span class="petit">Réponse de Vanessa : ' + esc(e.w) + '</span></div>'; }
  return h;
}
function detailExercice(e, ferme) {
  var t = detailExerciceTout(e);
  if (!ferme) { return t; }
  var i = t.indexOf("</div>") + 6;
  return t.slice(0, i) + '<details class="ex"><summary>Voir les questions et les réponses</summary>' + t.slice(i) + '</details>';
}
function cartesJournal() {
  var lg = state.log || [], h = "", i;
  h += '<div class="carte"><h2>📋 Dernier exercice</h2>';
  if (lg.length) {
    var d = lg[lg.length - 1];
    h += '<p><strong>' + esc(d.t) + '</strong></p>' + detailExercice(d, true);
  } else { h += '<p class="petit">Pas encore d\'exercice enregistré en détail. Le prochain apparaîtra ici.</p>'; }
  h += '</div>';
  var ex = 0, nq = 0, nw = 0, somme = 0, jours = {}, k;
  for (i = 0; i < state.history.length; i++) { var he = state.history[i]; if (typeof he.s === "number") { ex++; somme += he.s; } jours[he.d] = 1; }
  for (k in state.stats) { if (state.stats.hasOwnProperty(k)) { nq += state.stats[k].n || 0; nw += state.stats[k].w || 0; } }
  var lq = 0, lw = 0;
  for (i = 0; i < lg.length; i++) { lq += lg[i].n || 0; lw += (lg[i].n || 0) - (lg[i].ok || 0); }
  if (lq > nq) { nq = lq; nw = lw; }
  var nj = 0; for (k in jours) { if (jours.hasOwnProperty(k)) { nj++; } }
  h += '<div class="carte"><h2>📊 Statistiques</h2><div class="statgrille">';
  h += '<div>Exercices faits : <strong>' + ex + '</strong></div>';
  h += '<div>Questions répondues : <strong>' + nq + '</strong></div>';
  h += '<div>Réussite : <strong>' + (nq ? Math.round((nq - nw) / nq * 100) : 0) + ' %</strong> (' + (nq - nw) + ' bonne' + (nq - nw > 1 ? "s" : "") + ' réponse' + (nq - nw > 1 ? "s" : "") + ')</div>';
  h += '<div>Note moyenne : <strong>' + (ex ? fmt(somme / ex) : "0") + '/10</strong></div>';
  h += '<div>Jours de travail : <strong>' + nj + '</strong></div>';
  h += '</div></div>';
  return h;
}
function carteDetailStats() {
  var lg = state.log || [], i, j, h = "", agg = {}, ordre = [], rev = [], vus = {};
  for (i = 0; i < lg.length; i++) {
    var e = lg[i], key = e.t;
    if (!agg[key]) { agg[key] = { ok: 0, n: 0, fois: 0 }; ordre.push(key); }
    agg[key].ok += e.ok || 0; agg[key].n += e.n || 0; agg[key].fois++;
  }
  h += '<details class="carte repli"><summary>🧮 Détail par exercice</summary>';
  if (!ordre.length) { h += '<p class="petit">Le détail apparaîtra après le prochain exercice.</p>'; }
  for (i = ordre.length - 1; i >= 0; i--) {
    var a = agg[ordre[i]], p = a.n ? Math.round(a.ok / a.n * 100) : 0;
    h += '<div class="rep">' + '<strong>' + esc(ordre[i]) + '</strong>' + '<br><span class="petit">' + a.fois + ' fois · ' + a.ok + ' bonnes réponses sur ' + a.n + ' · ' + p + ' %</span></div>';
  }
  h += '</details>';
  for (i = lg.length - 1; i >= 0 && rev.length < 15; i--) {
    for (j = (lg[i].qs || []).length - 1; j >= 0 && rev.length < 15; j--) {
      var x = lg[i].qs[j];
      if (!x.ok && !vus[x.q]) { vus[x.q] = 1; rev.push(x); }
    }
  }
  h += '<details class="carte repli"><summary>🔁 Questions à revoir</summary>';
  if (!rev.length) { h += '<p class="petit">Aucune question ratée dans les derniers exercices. Bravo !</p>'; }

  return h + '</details>';
}
function carteJournalListe() {
  var lg = state.log || [], h = '<details class="carte repli"><summary>🗂️ Journal des exercices</summary>';
  if (!lg.length) { return h + '<p class="petit">Le journal se remplit à chaque exercice.</p></details>'; }

  if (c.test) { l.push("Test de départ (" + c.test.d + ") : texte 1 = " + c.test.A + "/5, texte 2 = " + c.test.B + "/4, texte 3 = " + c.test.C + "/4"); }
  else { l.push("Test de départ : pas encore fait"); }
  var qzl = "Quiz du jour : " + (state.quiz.total || 0) + " faits, " + state.quiz.streak + " jour(s) de suite";
  l.push(qzl);
  var pts = [];
  var al = lecons();
  for (var z = 0; z < al.length; z++) {
    var stz = state.stats[al[z].l.id];
    if (stz && stz.n > 0) { pts.push(al[z].l.titre + " : " + (stz.n - stz.w) + "/" + stz.n + " bonnes réponses"); }
  }
  if (pts.length) { l.push("Par leçon : " + pts.join(" ; ")); }
  var mf = [];
  for (var km in state.mots) { if (state.mots.hasOwnProperty(km) && state.mots[km].w > 0) { mf.push({ k: km, w: state.mots[km].w, n: state.mots[km].n }); } }
  mf.sort(function (a, b) { return b.w - a.w; });
  if (mf.length) { var mm = []; for (var kk = 0; kk < mf.length && kk < 15; kk++) { mm.push(mf[kk].k.replace("_", " : ") + " (" + mf[kk].w + " erreur" + (mf[kk].w > 1 ? "s" : "") + ")"); } l.push("Mots de dictée à revoir : " + mm.join(" ; ")); }
  l.push("Dernières séances :");
  var n = state.history.length;
  if (n === 0) { l.push("(aucune séance pour l'instant)"); }
  for (var i = Math.max(0, n - 15); i < n; i++) {
    var e = state.history[i];
    var ligne = "- " + e.d + " | " + themeNom(e.g) + " | " + e.t;
    if (typeof e.s === "number") { ligne += " | " + e.s + "/10"; }
    if (e.k === "ecriture") { ligne += " | séance d'écriture (photo à envoyer séparément)"; }
    if (e.w && e.w.length) { ligne += " | erreurs aux questions : " + e.w.join(", "); }
    if (e.e) { ligne += " | phrase : " + e.e.replace(/\s+/g, " "); }
    l.push(ligne);
  }
  return l.join("\n");
}

  h += '<h2>📈 Mon bilan</h2>';

    bind("b-reset-ok", function () { state = defaultState(); saveState(); showHome(); });
    bind("b-reset-non", function () { z.innerHTML = ""; });
  });
}

/* ---------- Plan des 30 jours ---------- */
var JOURS_FR = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
function codeLecon(l) { var p = l.titre.split(" · "); return p.length > 1 ? p[0] : l.titre; }
function showPlan() {
  ensurePlan();
  var plan = buildPlan(), start = state.plan.start, t = isoToday();
  var h = '<div class="carte quiz"><h2>Mon plan de quiz</h2>';
  h += '<p class="petit">Chaque quiz : 20 questions, dont 14 prévues dans ton plan et 6 pour revoir tes points faibles. Quand tu arrives au dernier quiz, 10 nouveaux sont préparés. Environ 9 questions sur 10 portent sur le français et les maths.</p></div>';
  h += '<div class="carte">';
  var fait = state.plan.done || 0;
  for (var d = 0; d < plan.length; d++) {
    var codes = [], vus = {};
    for (var k = 0; k < plan[d].length; k++) {
      var c = codeLecon(plan[d][k].l);
      if (!vus[c]) { vus[c] = 1; codes.push(c); }
    }
    var st = "";
    if (d < fait) { st = ' <span class="pastille">✓ ' + esc((state.plan.res && state.plan.res[d]) || "fait") + '</span>'; }
    else if (d === fait) { st = ' <span class="pastille">Prochain quiz</span>'; }
    h += '<div class="ligne"><strong>Jour ' + (d + 1) + '</strong>' + st + '<div class="petit">' + esc(codes.join(" · ")) + '</div></div>';
  }
  h += '</div><button class="bouton second" id="b-ret">Retour</button>';
  go(h);
  bind("b-ret", showProgression);
}

/* ---------- Dictées ---------- */
function normMot(s) {
  return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/œ/g, "oe").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "").replace(/[.]+$/, "");
}
function variantes(mot) {
  var v = mot.replace(/[()]/g, "").split("/"), r = [];
  for (var i = 0; i < v.length; i++) { var x = v[i].replace(/^\s+|\s+$/g, ""); if (x) { r.push(x); } }
  return r;
}
function motsGroupe(d, gi) {
  var out = [];
  for (var g = 0; g <= gi; g++) {
    for (var c = 0; c < CATS.length; c++) {
      var arr = d.g[g][CATS[c].k] || [];
      for (var i = 0; i < arr.length; i++) { out.push({ mot: arr[i], cat: c, g: g, d: d.n }); }
    }
  }
  return out;
}
function showDictee(mi, ti) {
  var d = DICTEES[MATIERES[mi].themes[ti].idx];
  var h = '<div class="carte"><h2>Dictée ' + d.n + ' · ' + esc(d.t) + '</h2>';
  h += '<p>Choisis ton groupe. Chaque groupe contient aussi les mots des groupes d\'avant.</p>';
  for (var g = 0; g < 3; g++) {
    h += '<button class="option" id="g' + g + '"><span class="gp" style="background:' + GROUPES[g].c + '">' + GROUPES[g].nom + '</span> <span class="petit">· ' + motsGroupe(d, g).length + ' mots</span></button>';
  }
  h += '</div><button class="bouton second" id="b-ret">Retour</button>';
  go(h);
  bind("b-ret", function () { showMatiere(mi); });
  for (var k = 0; k < 3; k++) { (function (n) { bind("g" + n, function () { showDicteeGroupe(mi, ti, n); }); })(k); }
}
function showDicteeGroupe(mi, ti, gi) {
  var d = DICTEES[MATIERES[mi].themes[ti].idx];
  var texte = DICTEE_TEXTES[String(d.n)] && DICTEE_TEXTES[String(d.n)][String(gi)];
  var h = '<div class="carte"><h2>Dictée ' + d.n + ' · ' + esc(d.t) + '</h2>';
  h += '<span class="gp" style="background:' + GROUPES[gi].c + '">' + GROUPES[gi].nom + '</span>';
  h += '<p>Qu\'est-ce que tu veux faire ?</p>';
  h += '<button class="bouton" id="b-mots">Voir les mots à apprendre</button>';
  h += '<button class="bouton" id="b-ecris">Écoute et écris les mots</button>';
  if (texte) { h += '<button class="bouton" id="b-dict">Écouter la dictée</button>'; }
  h += '</div><button class="bouton second" id="b-ret">Retour</button>';
  go(h);
  bind("b-ret", function () { showDictee(mi, ti); });
  bind("b-mots", function () { showDicteeMots(mi, ti, gi); });
  bind("b-ecris", function () { startMots(mi, ti, gi); });
  bind("b-dict", function () { showDicteeTexte(mi, ti, gi, texte); });
}
function showDicteeMots(mi, ti, gi) {
  var d = DICTEES[MATIERES[mi].themes[ti].idx];
  var h = '<div class="carte"><h2>Dictée ' + d.n + ' · mots</h2>';
  for (var g = 0; g <= gi; g++) {
    h += '<span class="gp" style="background:' + GROUPES[g].c + '">' + GROUPES[g].nom + '</span>';
    for (var c = 0; c < CATS.length; c++) {
      var arr = d.g[g][CATS[c].k] || [];
      if (arr.length) { h += '<p style="margin-bottom:6px"><strong>' + CATS[c].nom + ' :</strong> ' + esc(arr.join(", ")) + '</p>'; }
    }
  }
  h += '</div><button class="bouton" id="b-ecris">Écoute et écris les mots</button>';
  h += '<button class="bouton second" id="b-ret">Retour</button>';
  go(h);
  bind("b-ret", function () { showDicteeGroupe(mi, ti, gi); });
  bind("b-ecris", function () { startMots(mi, ti, gi); });
}
var dm = null;
function startMots(mi, ti, gi) {
  var d = DICTEES[MATIERES[mi].themes[ti].idx];
  var pool = motsGroupe(d, gi), items = [];
  var nb = Math.min(10, pool.length);
  while (items.length < nb && pool.length > 0) {
    var tot = 0, k, st;
    for (k = 0; k < pool.length; k++) { st = state.mots[pool[k].d + "_" + pool[k].mot]; tot += 1 + 2 * (st && st.n ? st.w / st.n : 0.3); }
    var r = Math.random() * tot, idx = pool.length - 1;
    for (k = 0; k < pool.length; k++) { st = state.mots[pool[k].d + "_" + pool[k].mot]; r -= 1 + 2 * (st && st.n ? st.w / st.n : 0.3); if (r <= 0) { idx = k; break; } }
    items.push(pool[idx]);
    pool.splice(idx, 1);
  }
  dm = { mi: mi, ti: ti, gi: gi, d: d, items: items, i: 0, ok: 0, bad: [] };
  showMot();
}
function showMot() {
  var it = dm.items[dm.i], total = dm.items.length;
  var h = '<div class="carte"><span class="gp" style="background:' + GROUPES[it.g].c + '">' + GROUPES[dm.gi].nom + '</span>';
  h += '<div class="suivi">Mot ' + (dm.i + 1) + ' sur ' + total + ' · Dictée ' + dm.d.n + '</div>';
  h += '<h2>' + CATS[it.cat].un + '</h2>';
  h += '<p class="petit">Touche « Écouter », puis écris le mot (avec son article si c\'est un nom).</p>';
  h += '<button class="bouton" id="b-ecoute">Écouter le mot</button>';
  h += '<input class="mot" id="mot-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Écris le mot">';
  h += '<p class="petit" id="mot-msg"></p>';
  h += '<div id="retour"></div>';
  h += '<button class="bouton second" id="b-verif">Vérifier</button></div>';
  h += '<button class="bouton second" id="b-ret">Arrêter</button>';
  go(h);
  var msg = document.getElementById("mot-msg");
  var vars = variantes(it.mot);
  function ecouter() { parler(vars[0], msg, 0.75); }
  bind("b-ecoute", ecouter);
  bind("b-ret", function () { stopVoix(); showDicteeGroupe(dm.mi, dm.ti, dm.gi); });
  var inp = document.getElementById("mot-in");
  var verifie = false;
  /* Le clavier de l'iPad ne doit pas cacher la zone d'écriture : place en bas et zone remontée (le bouton Écouter reste visible) */
  function remonteMot() {
    document.body.className = (document.body.className || "") + " clavier-ouvert";
    window.setTimeout(function () {
      var y = inp.getBoundingClientRect().top + (window.pageYOffset || 0) - 170;
      window.scrollTo(0, y < 0 ? 0 : y);
    }, 350);
  }
  inp.addEventListener("focus", remonteMot, false);
  inp.addEventListener("blur", function () { document.body.className = (document.body.className || "").replace(/\s*clavier-ouvert/g, ""); }, false);
  bind("b-verif", function () {
    if (verifie) { return; }
    var rep = normMot(inp.value);
    if (!rep) { msg.textContent = "Écris d'abord le mot."; return; }
    verifie = true;
    var ok = false;
    for (var i = 0; i < vars.length; i++) { if (normMot(vars[i]) === rep) { ok = true; } }
    var key = dm.d.n + "_" + it.mot;
    if (!state.mots[key]) { state.mots[key] = { n: 0, w: 0 }; }
    state.mots[key].n++;
    if (ok) { dm.ok++; } else { state.mots[key].w++; dm.bad.push(vars.join(" ou ")); }
    saveState();
    var m = ok ? '<div class="retour ok"><strong>Bravo ! 🎉</strong> ' + esc(vars.join(" ou ")) + '</div>'
              : '<div class="retour ko"><strong>Pas grave, on apprend ! 💪</strong> Ça s\'écrit : <strong>' + esc(vars.join(" ou ")) + '</strong></div>';
    var last = (dm.i === dm.items.length - 1);
    document.getElementById("retour").innerHTML = m + '<button class="bouton" id="b-next">' + (last ? "Continuer" : "Mot suivant") + '</button>';
    document.getElementById("b-verif").style.display = "none";
    bind("b-next", function () { if (last) { finishMots(); } else { dm.i++; showMot(); window.setTimeout(function () { var b = document.getElementById("b-ecoute"); if (b) { b.click(); } }, 150); } });
  });
}
function finishMots() {
  stopVoix();
  var s = pct10(dm.ok, dm.items.length);
  state.history.push({ d: today(), k: "dictee", g: "dictee" + dm.d.n, t: "Dictée " + dm.d.n + " · mots (" + GROUPES[dm.gi].nom + ")", s: s, w: [], e: "", q: "", l: 0 });
  if (state.history.length > 200) { state.history = state.history.slice(state.history.length - 200); }
  saveState();
  var etoiles = s >= 10 ? "★★★" : (s >= 8 ? "★★☆" : (s >= 6 ? "★☆☆" : "☆☆☆"));
  var h = '<div class="carte" style="text-align:center"><div class="etoiles">' + etoiles + '</div><div class="note">' + dm.ok + ' / ' + dm.items.length + '</div>';
  h += '<p>' + (s >= 8 ? "Excellent travail !" : (s >= 6 ? "C'est bien. Encore un petit effort." : "On s'entraîne encore, tu vas y arriver.")) + '</p>';
  if (dm.bad.length) { h += '<p class="petit" style="text-align:left"><strong>Mots à revoir :</strong> ' + esc(dm.bad.join(" · ")) + '</p>'; }
  h += '<button class="bouton" id="b-again">Recommencer avec d\'autres mots</button>';
  h += '<button class="bouton second" id="b-ret">Retour à la dictée</button>';
  h += '<button class="bouton second" id="b-acc">Accueil</button></div>';
  go(h);
  var a = dm;
  bind("b-again", function () { startMots(a.mi, a.ti, a.gi); });
  bind("b-ret", function () { showDicteeGroupe(a.mi, a.ti, a.gi); });
  bind("b-acc", showHome);
}
function showDicteeTexte(mi, ti, gi, texte) {
  var d = DICTEES[MATIERES[mi].themes[ti].idx];
  var phrases = texte.match(/[^.!?]+[.!?]+(?:\s*»)?/g) || [texte];
  for (var p = 0; p < phrases.length; p++) { phrases[p] = phrases[p].replace(/^\s+|\s+$/g, ""); }
  var i = 0;
  var h = '<div class="carte"><h2>Dictée ' + d.n + ' · ' + esc(d.t) + '</h2>';
  h += '<span class="gp" style="background:' + GROUPES[gi].c + '">' + GROUPES[gi].nom + '</span>';
  h += '<p class="petit">Écris sur ta feuille. Touche « Écouter » pour entendre la phrase, « Phrase suivante » pour continuer. À la fin, montre le texte pour te corriger.</p>';
  h += '<div class="suivi" id="d-num"></div>';
  h += '<button class="bouton" id="b-ec">Écouter la phrase</button>';
  h += '<div class="duo"><button class="bouton second" id="b-pre">Phrase précédente</button><button class="bouton second" id="b-sui">Phrase suivante</button></div>';
  h += '<p class="petit" id="d-msg"></p>';
  h += '<button class="bouton second" id="b-voir">Voir le texte pour me corriger</button>';
  h += '<div id="d-txt"></div></div>';
  h += '<button class="bouton second" id="b-ret">Retour</button>';
  go(h);
  var msg = document.getElementById("d-msg");
  function maj() { document.getElementById("d-num").textContent = "Phrase " + (i + 1) + " sur " + phrases.length; }
  maj();
  bind("b-ec", function () { parler(phrases[i], msg, 0.75); });
  bind("b-sui", function () { if (i < phrases.length - 1) { i++; maj(); parler(phrases[i], msg, 0.75); } else { msg.textContent = "C'est la dernière phrase."; } });
  bind("b-pre", function () { if (i > 0) { i--; maj(); parler(phrases[i], msg, 0.75); } });
  var texteVisible = false;
  bind("b-voir", function () {
    texteVisible = !texteVisible;
    document.getElementById("d-txt").innerHTML = texteVisible ? '<div class="texte-histoire">' + esc(texte) + '</div>' : "";
    document.getElementById("b-voir").textContent = texteVisible ? "Cacher le texte" : "Voir le texte pour me corriger";
  });
  bind("b-ret", function () { stopVoix(); showDicteeGroupe(mi, ti, gi); });
}

function showSync(msg) {
  var h = '<div class="carte"><h2>Synchronisation</h2>';
  if (!syncChanger) {
    h += '<p>Cet appareil est relié à ta progression. Code famille : <strong>' + esc(syncCode()) + '</strong></p>';
    h += '<p class="petit">Pour utiliser un autre appareil, ouvre le site dessus et saisis le même code.</p>';
    h += '<p class="petit" id="sy-msg">' + esc(msg || syncMsg) + '</p>';
    h += '<button class="bouton" id="b-sy-now">Synchroniser maintenant</button>';
    h += '<button class="bouton second" id="b-sy-off">Changer de code</button>';
  } else {
    h += '<p>Saisis ton code famille (au moins 6 caractères). Le code de départ est 000000 : tous les appareils qui l\'utilisent partagent la même progression. Sur tous les appareils, saisis le même code.</p>';
    h += '<input class="mot" id="sy-code" type="text" value="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Code famille">';
    h += '<p class="petit" id="sy-msg">' + esc(msg || "") + '</p>';
    h += '<button class="bouton" id="b-sy-ok">Valider</button>';
  }
  h += '</div><button class="bouton second" id="b-sy-ret">Accueil</button>';
  go(h);
  bind("b-sy-ret", function () { syncChanger = false; showHome(); });
  bind("b-sy-now", function () { syncPull(function (ok) { showSync(ok ? "Synchronisé." : "Pas de connexion pour le moment."); }); });
  bind("b-sy-off", function () { syncChanger = true; syncReady = false; showSync(); });
  bind("b-sy-ok", function () {
    var v = document.getElementById("sy-code").value.replace(/\s+/g, "");
    if (v.length < 6 || v.length > 64) { document.getElementById("sy-msg").textContent = "Le code doit faire au moins 6 caractères."; return; }
    try { window.localStorage.setItem(STORE + "_code", v); } catch (e) {}
    syncChanger = false;
    syncPull(function (ok) { if (ok) { showHome(); } else { showSync("Pas de connexion. Réessaie plus tard."); } });
  });
}
function syncAuto() {
  if (!syncActif()) { return; }
  if (syncDirty && syncReady) { syncPush(); }
  syncPull(function (ok) { if (ok && document.getElementById("b-comp") && !document.getElementById("sy-code")) { showHome(); } });
}
try {
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (syncTimer) { window.clearTimeout(syncTimer); } syncPush(); } else { syncAuto(); }
  });
  window.addEventListener("pagehide", function () { syncPush(); });
  window.addEventListener("pageshow", function () { syncAuto(); });
  window.setInterval(function () { if (!document.hidden) { if (syncDirty && syncReady) { syncPush(); } else { syncPull(); } } }, 60000);
} catch (e) {}
{ showHome(); syncPull(function (ok) { if (ok && document.getElementById("b-comp")) { showHome(); } }); }
</script>
