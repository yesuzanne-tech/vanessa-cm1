ches place-t-elle ?","o":["Dix","Deux","Quatre"],"a":2,"why":"« Elle place quatre torches. »"},{"q":"Où place-t-elle les torches ?","o":["Au fond de la grotte","Sur son sac","À l'entrée de la grotte"],"a":2,"why":"« À l'entrée pour éclairer. »"},{"q":"Pourquoi les squelettes n'approchent-ils pas ?","o":["À cause du bruit","À cause de l'épée","À cause de la lumière"],"a":2,"why":"« N'osent pas s'approcher de la lumière. »"},{"q":"Vrai ou faux : Sofia repart le soir suivant.","o":["Vrai","Faux"],"a":1,"why":"Elle repart « au matin »."}],"ecrit":"Écris une phrase : comment Sofia se protège-t-elle des squelettes ?"},{"id":"2-ml-lettre","univers":"Miraculous","titre":"La lettre mystérieuse","texte":"En rentrant de l'école, Léa trouve une enveloppe violette dans sa boîte aux lettres. Elle ne porte ni nom ni adresse. À l'intérieur, une petite carte dit : « Rendez-vous demain à midi au pied de la grande tour. » Léa hésite : est-ce une blague ? Elle décide finalement d'y aller avec son amie Zoé.","qs":[{"q":"De quelle couleur est l'enveloppe ?","o":["Violette","Rose","Jaune"],"a":0,"why":"« Une enveloppe violette. »"},{"q":"Qu'y a-t-il sur l'enveloppe ?","o":["Le nom de Léa","Rien : ni nom ni adresse","Un dessin"],"a":1,"why":"« Elle ne porte ni nom ni adresse. »"},{"q":"Quand est le rendez-vous ?","o":["Ce soir à minuit","Samedi matin","Demain à midi"],"a":2,"why":"« Rendez-vous demain à midi. »"},{"q":"Où doit-elle aller ?","o":["À l'école","Au parc","Au pied de la grande tour"],"a":2,"why":"« Au pied de la grande tour. »"},{"q":"Avec qui Léa décide-t-elle d'y aller ?","o":["Toute seule","Avec son amie Zoé","Avec sa mère"],"a":1,"why":"« Avec son amie Zoé. »"}],"ecrit":"Écris une phrase : pourquoi Léa hésite-t-elle ?"},{"id":"2-mc-neige","univers":"Minecraft","titre":"Le bonhomme de neige","texte":"Dans la plaine enneigée, Karim décide de construire un golem de neige. Il empile deux blocs de neige, puis pose une citrouille sur le dessus. Le golem prend vie et lance des boules de neige aux zombies qui approchent. Karim est fier de son nouveau garde du corps. Ils passent la nuit ensemble près d'un feu de camp.","qs":[{"q":"Où se trouve Karim ?","o":["Dans un désert","Dans une mine","Dans une plaine enneigée"],"a":2,"why":"« Dans la plaine enneigée. »"},{"q":"Combien de blocs de neige empile-t-il ?","o":["Deux","Trois","Cinq"],"a":0,"why":"« Il empile deux blocs de neige. »"},{"q":"Que pose-t-il sur le dessus ?","o":["Une torche","Un chapeau","Une citrouille"],"a":2,"why":"« Pose une citrouille sur le dessus. »"},{"q":"Que fait le golem ?","o":["Il s'endort","Il lance des boules de neige aux zombies","Il construit un abri"],"a":1,"why":"« Lance des boules de neige aux zombies. »"},{"q":"Vrai ou faux : Karim passe la nuit près d'un feu de camp.","o":["Vrai","Faux"],"a":0,"why":"« Près d'un feu de camp. »"}],"ecrit":"Écris une phrase : à quoi sert le golem de neige ?"},{"id":"2-pk-ecole","univers":"Pokémon","titre":"Le Pokémon à l'école","texte":"Pour la journée des animaux, Adam apporte son Pokémon à l'école. Tous les élèves veulent le caresser, mais le Pokémon est très timide. Il se cache derrière le cartable d'Adam. La maîtresse propose de parler doucement et de rester assis. Peu à peu, le Pokémon sort et se laisse caresser par chaque enfant.","qs":[{"q":"Pourquoi Adam apporte-t-il son Pokémon ?","o":["Pour un anniversaire","Pour la journée des animaux","Parce qu'il est perdu"],"a":1,"why":"« Pour la journée des animaux. »"},{"q":"Comment est le Pokémon ?","o":["Très agressif","Très bruyant","Très timide"],"a":2,"why":"« Le Pokémon est très timide. »"},{"q":"Où se cache-t-il ?","o":["Sous la table","Derrière le cartable d'Adam","Dans l'armoire"],"a":1,"why":"« Il se cache derrière le cartable d'Adam. »"},{"q":"Que propose la maîtresse ?","o":["De parler doucement et de rester assis","De crier","De sortir de la classe"],"a":0,"why":"« La maîtresse propose de parler doucement et de rester assis. »"},{"q":"Vrai ou faux : À la fin, le Pokémon reste caché.","o":["Vrai","Faux"],"a":1,"why":"Il « sort et se laisse caresser »."}],"ecrit":"Écris une phrase : comment les élèves rassurent-ils le Pokémon ?"},{"id":"2-mc-bibliotheque","univers":"Minecraft","titre":"La bibliothèque du village","texte":"Au centre du village, Anaïs découvre une bibliothèque remplie de livres enchantés. Un villageois lui explique qu'il échange un livre contre des émeraudes. Anaïs en possède douze. Elle choisit un livre qui rend les outils plus solides et le paie neuf émeraudes. Il lui en reste donc trois.","qs":[{"q":"Où se trouve la bibliothèque ?","o":["Au bord d'une rivière","Dans une grotte","Au centre du village"],"a":2,"why":"« Au centre du village. »"},{"q":"Contre quoi le villageois échange-t-il un livre ?","o":["Des émeraudes","Du pain","Des planches"],"a":0,"why":"« Il échange un livre contre des émeraudes. »"},{"q":"Que fait le livre choisi par Anaïs ?","o":["Il soigne","Il fait voler","Il rend les outils plus solides"],"a":2,"why":"« Un livre qui rend les outils plus solides. »"},{"q":"Combien d'émeraudes lui reste-t-il ?","o":["Neuf","Douze","Trois"],"a":2,"why":"12 - 9 = 3."},{"q":"Vrai ou faux : Anaïs paie le livre avec du pain.","o":["Vrai","Faux"],"a":1,"why":"Elle le paie neuf émeraudes."}],"ecrit":"Écris une phrase : que choisit Anaïs à la bibliothèque ?"},{"id":"2-ml-defile","univers":"Miraculous","titre":"Le défilé de mode","texte":"Samedi, Inès présente ses robes lors d'un défilé organisé dans la salle des fêtes. Elle est très stressée, car cent personnes sont venues. Juste avant de passer, un bouton de sa robe bleue se détache. Sa meilleure amie le recoud en deux minutes avec du fil doré. Le public applaudit longtemps.","qs":[{"q":"Où a lieu le défilé ?","o":["Dans la salle des fêtes","Dans un théâtre","À l'école"],"a":0,"why":"« Dans la salle des fêtes. »"},{"q":"Combien de personnes sont venues ?","o":["Mille","Cent","Dix"],"a":1,"why":"« Cent personnes sont venues. »"},{"q":"Qu'arrive-t-il à la robe bleue ?","o":["Elle se déchire","Elle est tachée","Un bouton se détache"],"a":2,"why":"« Un bouton de sa robe bleue se détache. »"},{"q":"Qui répare la robe ?","o":["Sa meilleure amie","Un couturier","Sa mère"],"a":0,"why":"« Sa meilleure amie le recoud. »"},{"q":"Vrai ou faux : Le public est déçu.","o":["Vrai","Faux"],"a":1,"why":"« Le public applaudit longtemps. »"}],"ecrit":"Écris une phrase : pourquoi Inès est-elle stressée ?"},{"id":"2-mc-ocean","univers":"Minecraft","titre":"Le trésor de l'océan","texte":"Eliott plonge dans l'océan avec une potion pour respirer sous l'eau. Il aperçoit une épave de bateau couverte d'algues. Dans un coffre, il trouve un cœur de l'océan et deux pommes dorées. Un gardien de l'eau lui bloque le passage, mais Eliott le contourne par le haut. Il remonte à la surface heureux de sa trouvaille.","qs":[{"q":"Qu'utilise Eliott pour respirer sous l'eau ?","o":["Une bouteille d'air","Une potion","Un masque"],"a":1,"why":"« Avec une potion pour respirer sous l'eau. »"},{"q":"Qu'aperçoit-il ?","o":["Une épave de bateau","Une grotte","Un château"],"a":0,"why":"« Une épave de bateau couverte d'algues. »"},{"q":"Que trouve-t-il dans le coffre ?","o":["De l'or et des diamants","Une épée et un bouclier","Un cœur de l'océan et deux pommes dorées"],"a":2,"why":"« Un cœur de l'océan et deux pommes dorées. »"},{"q":"Comment évite-t-il le gardien ?","o":["Il le contourne par le haut","Il le combat","Il attend"],"a":0,"why":"« Eliott le contourne par le haut. »"},{"q":"Vrai ou faux : Eliott est déçu à la fin.","o":["Vrai","Faux"],"a":1,"why":"Il est « heureux de sa trouvaille »."}],"ecrit":"Écris une phrase : qu'est-ce qu'Eliott trouve dans le coffre ?"},{"id":"2-pk-nuit","univers":"Pokémon","titre":"La nuit des étoiles filantes","texte":"Cette nuit, une pluie d'étoiles filantes doit traverser le ciel. Lola et son Pokémon grimpent sur la colline derrière la maison avec une couverture. Ils attendent une heure en mangeant des biscuits. Soudain, huit étoiles passent l'une après l'autre. Lola fait un vœu à voix basse et le Pokémon s'endort sur ses genoux.","qs":[{"q":"Que doit-il se passer cette nuit ?","o":["Une éclipse","Une pluie d'étoiles filantes","Un orage"],"a":1,"why":"« Une pluie d'étoiles filantes doit traverser le ciel. »"},{"q":"Où vont Lola et son Pokémon ?","o":["Sur la plage","Dans la forêt","Sur la colline derrière la maison"],"a":2,"why":"« La colline derrière la maison. »"},{"q":"Combien de temps attendent-ils ?","o":["Toute la nuit","Dix minutes","Une heure"],"a":2,"why":"« Ils attendent une heure. »"},{"q":"Combien d'étoiles passent ?","o":["Huit","Trois","Douze"],"a":0,"why":"« Huit étoiles passent. »"},{"q":"Vrai ou faux : Lola fait un vœu.","o":["Vrai","Faux"],"a":0,"why":"« Lola fait un vœu à voix basse. »"}],"ecrit":"Écris une phrase : que font Lola et son Pokémon en attendant les étoiles ?"},{"id":"2-mc-volcan","univers":"Minecraft","titre":"L'ascension de la montagne","texte":"Nathan décide d'escalader la plus haute montagne de sa région. Il emporte de la nourriture, une corde et des blocs de pierre. À mi-chemin, une tempête de neige se lève et le force à construire un abri. Il y reste jusqu'à ce que le vent se calme. Le lendemain, il atteint le sommet et plante un drapeau rouge.","qs":[{"q":"Quel est le but de Nathan ?","o":["Escalader la plus haute montagne","Explorer une grotte","Traverser un désert"],"a":0,"why":"« Escalader la plus haute montagne de sa région. »"},{"q":"Qu'emporte-t-il ?","o":["Une tente et une pioche","Une épée et un arc","De la nourriture, une corde et des blocs de pierre"],"a":2,"why":"« De la nourriture, une corde et des blocs de pierre. »"},{"q":"Que fait-il quand la tempête se lève ?","o":["Il continue de grimper","Il construit un abri","Il redescend en courant"],"a":1,"why":"« Le force à construire un abri. »"},{"q":"Quand atteint-il le sommet ?","o":["Le soir même","Le lendemain","Une semaine plus tard"],"a":1,"why":"« Le lendemain, il atteint le sommet. »"},{"q":"Vrai ou faux : Le drapeau planté est rouge.","o":["Vrai","Faux"],"a":0,"why":"« Un drapeau rouge. »"}],"ecrit":"Écris une phrase : que fait Nathan pendant la tempête ?"},{"id":"2-ml-chaton","univers":"Miraculous","titre":"Le chaton du balcon","texte":"Chaque matin, Maya entend un petit miaulement sur son balcon. Un jour, elle découvre un chaton gris caché derrière un pot de fleurs. Il est maigre et tremble de froid. Maya lui prépare une boîte avec une vieille écharpe et lui donne du lait tiède. Elle écrit une affiche pour retrouver le propriétaire.","qs":[{"q":"Où est caché le chaton ?","o":["Sous le lit","Derrière un pot de fleurs","Dans le placard"],"a":1,"why":"« Caché derrière un pot de fleurs. »"},{"q":"De quelle couleur est le chaton ?","o":["Blanc","Noir","Gris"],"a":2,"why":"« Un chaton gris. »"},{"q":"Pourquoi le chaton tremble-t-il ?","o":["Il a froid","Il est malade","Il a peur du chien"],"a":0,"why":"« Il est maigre et tremble de froid. »"},{"q":"Que lui prépare Maya ?","o":["Un panier en osier","Un lit en carton","Une boîte avec une vieille écharpe"],"a":2,"why":"« Une boîte avec une vieille écharpe. »"},{"q":"Pourquoi Maya écrit-elle une affiche ?","o":["Pour retrouver le propriétaire","Pour fêter son anniversaire","Pour vendre le chaton"],"a":0,"why":"« Pour retrouver le propriétaire. »"}],"ecrit":"Écris une phrase : comment Maya s'occupe-t-elle du chaton ?"},{"id":"2-vq-biblio","univers":"Vie de tous les jours","titre":"La bibliothèque","texte":"Mercredi après-midi, Yasmine va à la bibliothèque de son quartier. Elle emprunte deux livres : un roman d'aventures et un album sur les dauphins. La bibliothécaire, madame Roux, lui explique qu'elle doit les rendre dans trois semaines. Yasmine range les livres dans son sac et note la date sur son agenda. Elle commence déjà le roman sur le banc devant l'entrée.","qs":[{"q":"Quel jour Yasmine va-t-elle à la bibliothèque ?","o":["Samedi","Vendredi","Mercredi"],"a":2,"why":"« Mercredi après-midi. »"},{"q":"Combien de livres emprunte-t-elle ?","o":["Trois","Deux","Un"],"a":1,"why":"« Elle emprunte deux livres. »"},{"q":"Qui est madame Roux ?","o":["La maîtresse","La bibliothécaire","La voisine"],"a":1,"why":"« La bibliothécaire, madame Roux. »"},{"q":"Dans combien de temps doit-elle rendre les livres ?","o":["Trois semaines","Trois jours","Deux semaines"],"a":0,"why":"« Dans trois semaines. »"},{"q":"Où commence-t-elle son roman ?","o":["Dans le bus","À la maison","Sur le banc devant l'entrée"],"a":2,"why":"« Sur le banc devant l'entrée. »"}],"ecrit":"Écris une phrase : pourquoi Yasmine note-t-elle la date sur son agenda ?"},{"id":"2-vq-gateau","univers":"Vie de tous les jours","titre":"Le gâteau d'anniversaire","texte":"Pour les huit ans de son frère Adam, Camille prépare un gâteau au chocolat. Elle casse trois œufs, mélange la farine et le sucre, puis ajoute le chocolat fondu. Le gâteau cuit pendant trente minutes. Pendant ce temps, elle décore la table avec des ballons bleus. Quand le gâteau est prêt, tout le monde chante et Adam souffle ses bougies.","qs":[{"q":"Quel âge a Adam ?","o":["Huit ans","Dix ans","Sept ans"],"a":0,"why":"« Les huit ans de son frère Adam. »"},{"q":"Combien d'œufs Camille casse-t-elle ?","o":["Deux","Trois","Quatre"],"a":1,"why":"« Elle casse trois œufs. »"},{"q":"Combien de temps le gâteau cuit-il ?","o":["Dix minutes","Trente minutes","Une heure"],"a":1,"why":"« Le gâteau cuit pendant trente minutes. »"},{"q":"Que fait Camille pendant la cuisson ?","o":["Elle fait la vaisselle","Elle dort","Elle décore la table"],"a":2,"why":"« Elle décore la table avec des ballons bleus. »"},{"q":"Vrai ou faux : Les ballons sont rouges.","o":["Vrai","Faux"],"a":1,"why":"Ils sont bleus."}],"ecrit":"Écris une phrase : que fait Adam à la fin ?"},{"id":"2-vq-train","univers":"Vie de tous les jours","titre":"Le voyage en train","texte":"Dimanche matin, Malik prend le train avec sa grand-mère pour aller à Lyon. Le voyage dure deux heures. Dans le wagon, il regarde les champs par la fenêtre et dessine un cheval dans son carnet. Sa grand-mère lui a préparé un sandwich au jambon. À l'arrivée, son oncle les attend sur le quai.","qs":[{"q":"Où vont Malik et sa grand-mère ?","o":["À Lyon","À Paris","À Nice"],"a":0,"why":"« Pour aller à Lyon. »"},{"q":"Combien de temps dure le voyage ?","o":["Deux heures","Trois heures","Une heure"],"a":0,"why":"« Le voyage dure deux heures. »"},{"q":"Que dessine Malik ?","o":["Un cheval","Un chien","Un train"],"a":0,"why":"« Il dessine un cheval dans son carnet. »"},{"q":"Quel sandwich mange-t-il ?","o":["Au poulet","Au jambon","Au fromage"],"a":1,"why":"« Un sandwich au jambon. »"},{"q":"Qui les attend à l'arrivée ?","o":["Sa tante","Son oncle","Son père"],"a":1,"why":"« Son oncle les attend sur le quai. »"}],"ecrit":"Écris une phrase : que regarde Malik par la fenêtre ?"}],"3":[{"id":"3-mc-forteresse","univers":"Minecraft","titre":"La forteresse sous la montagne","texte":"Camille et son cousin Yanis découvrent l'entrée d'une forteresse cachée sous la montagne. D'abord, ils allument des torches pour traverser un long couloir sombre. Ensuite, ils tombent sur une salle remplie de coffres, mais une porte en fer en bloque la sortie. Yanis cherche un levier pendant que Camille surveille les squelettes. Quand il le trouve enfin, la porte s'ouvre avec un grand bruit. Les deux cousins s'enfuient avec trois coffres pleins de diamants.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Ils allument des torches, ils trouvent la salle aux coffres, Yanis trouve le levier, ils s'enfuient.","Ils s'enfuient, Yanis trouve le levier, ils allument des torches, ils trouvent la salle aux coffres.","Yanis trouve le levier, ils trouvent la salle aux coffres, ils allument des torches, ils s'enfuient."],"a":0,"why":"D'abord les torches, ensuite la salle, puis le levier, enfin la fuite."},{"q":"Qui sont Camille et Yanis ?","o":["Un frère et une sœur","Deux voisins","Deux cousins"],"a":2,"why":"« Camille et son cousin Yanis. »"},{"q":"Pourquoi la porte en fer pose-t-elle problème ?","o":["Elle cache un monstre","Elle bloque la sortie","Elle est cassée"],"a":1,"why":"« Une porte en fer en bloque la sortie. »"},{"q":"Pendant que Yanis cherche le levier, que fait Camille ?","o":["Elle allume des torches","Elle ouvre les coffres","Elle surveille les squelettes"],"a":2,"why":"« Camille surveille les squelettes. »"},{"q":"Quel est le meilleur résumé ?","o":["Deux cousins se disputent dans une forteresse.","Deux cousins explorent une forteresse, débloquent une porte et repartent avec des diamants.","Un squelette poursuit deux enfants dans une grotte."],"a":1,"why":"Le bon résumé contient le lieu, le problème (la porte) et la fin (les diamants)."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-pk-tournoi","univers":"Pokémon","titre":"Le petit tournoi","texte":"Le dimanche, un tournoi pour les jeunes dresseurs a lieu sur la place du village. Baptiste est nerveux, car son Pokémon, une petite tortue, n'a jamais gagné de combat. Au premier tour, la tortue se cache dans sa carapace et l'adversaire s'épuise à l'attaquer. Au deuxième tour, elle fait de même et gagne encore. Baptiste comprend alors que sa tortue est très forte pour se défendre. En finale, elle perd, mais le public l'applaudit longuement, et Baptiste n'a jamais été aussi fier.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["La tortue perd en finale, Baptiste est nerveux, le public applaudit, la tortue gagne deux tours.","Le public applaudit, la tortue gagne deux tours, Baptiste est nerveux, elle perd en finale.","Baptiste est nerveux, la tortue gagne deux tours, elle perd en finale, le public applaudit."],"a":2,"why":"Il est nerveux avant le tournoi, puis il y a les deux victoires, la finale perdue et les applaudissements."},{"q":"Pourquoi Baptiste est-il nerveux au début ?","o":["Il est en retard","Il a oublié son Pokémon","Son Pokémon n'a jamais gagné de combat"],"a":2,"why":"« N'a jamais gagné de combat. »"},{"q":"Comment la tortue gagne-t-elle ses combats ?","o":["Elle fait peur à l'adversaire","Elle se cache dans sa carapace pendant que l'adversaire s'épuise","Elle attaque très vite"],"a":1,"why":"« Se cache dans sa carapace et l'adversaire s'épuise. »"},{"q":"Que comprend Baptiste ?","o":["Que sa tortue est trop lente","Qu'il doit changer de Pokémon","Que sa tortue est très forte pour se défendre"],"a":2,"why":"« Sa tortue est très forte pour se défendre. »"},{"q":"Pourquoi Baptiste est-il fier malgré la défaite ?","o":["Parce qu'il a gagné la coupe","Parce que sa tortue a été applaudie et a bien combattu","Parce que l'adversaire a abandonné"],"a":1,"why":"Le public l'applaudit longuement : sa tortue a fait de son mieux."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-incendie","univers":"Minecraft","titre":"L'incendie dans la forêt","texte":"Un après-midi, Hana remarque de la fumée au-dessus de la forêt de chênes. Elle court prévenir les villageois, mais personne n'a de seau d'eau. Alors, elle propose de creuser une tranchée autour des arbres pour arrêter le feu. Tout le monde se met à creuser avec des pelles. Quand le feu arrive à la tranchée, il ne peut plus avancer et s'éteint tout seul. Le soir, le village décide de planter de nouveaux arbres pour remplacer ceux qui ont brûlé.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Ils creusent une tranchée, Hana voit la fumée, le feu s'arrête, elle prévient le village.","Hana voit la fumée, elle prévient le village, ils creusent une tranchée, le feu s'arrête.","Le feu s'arrête, Hana voit la fumée, ils creusent une tranchée, elle prévient le village."],"a":1,"why":"La fumée d'abord, puis l'alerte, puis la tranchée, enfin le feu s'arrête."},{"q":"Pourquoi ne peuvent-ils pas éteindre le feu avec de l'eau ?","o":["Il n'y a pas de rivière","Les villageois ont peur","Personne n'a de seau d'eau"],"a":2,"why":"« Personne n'a de seau d'eau. »"},{"q":"À quoi sert la tranchée ?","o":["À stocker de l'eau","À empêcher le feu d'avancer","À cacher les villageois"],"a":1,"why":"Le feu ne peut plus avancer au-delà de la tranchée."},{"q":"Que décide le village le soir ?","o":["De déménager","De construire un mur","De planter de nouveaux arbres"],"a":2,"why":"« Planter de nouveaux arbres. »"},{"q":"Quel est le meilleur résumé ?","o":["Les villageois partent habiter ailleurs après un incendie.","Grâce à l'idée de Hana, les villageois arrêtent un incendie en creusant une tranchée.","Hana se perd dans la forêt à cause de la fumée."],"a":1,"why":"Le résumé garde le problème (le feu), la solution (la tranchée) et le résultat."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-ml-cantine","univers":"Miraculous","titre":"Le secret de la cantine","texte":"Depuis lundi, de la nourriture disparaît mystérieusement de la cantine du collège. Le cuisinier est très inquiet et pense qu'un élève vole. Mardi soir, Théo et Alya décident de se cacher derrière le comptoir pour surveiller. À minuit, ils voient une petite créature rousse sortir du placard et manger des fruits. Elle s'excuse, expliquant qu'elle a faim car elle est perdue loin de chez elle. Les deux amis la ramènent dans un panier et la cachent chez Alya jusqu'à ce qu'ils trouvent comment la renvoyer.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["La nourriture disparaît, Théo et Alya surveillent, ils voient la créature, ils l'emmènent chez Alya.","Ils voient la créature, la nourriture disparaît, ils l'emmènent chez Alya, ils surveillent.","Ils emmènent la créature chez Alya, la nourriture disparaît, ils surveillent, ils la voient."],"a":0,"why":"La disparition vient d'abord, puis la surveillance, la rencontre et la cachette."},{"q":"Qui le cuisinier soupçonne-t-il ?","o":["Un autre cuisinier","Le directeur","Un élève"],"a":2,"why":"« Il pense qu'un élève vole. »"},{"q":"Pourquoi la créature mange-t-elle des fruits ?","o":["Parce qu'elle a faim et qu'elle est perdue","Parce qu'elle veut faire une farce","Parce qu'elle aime se cacher"],"a":0,"why":"« Elle a faim car elle est perdue loin de chez elle. »"},{"q":"Où Théo et Alya se cachent-ils pour surveiller ?","o":["Sous une table","Dans le placard","Derrière le comptoir"],"a":2,"why":"« Se cacher derrière le comptoir. »"},{"q":"Quel est le meilleur résumé ?","o":["Théo et Alya passent la nuit au collège pour s'amuser.","Deux amis découvrent qui vole la nourriture de la cantine et recueillent une créature affamée.","Un cuisinier punit des élèves qui volent."],"a":1,"why":"Le résumé donne le mystère, la découverte et la décision des amis."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-golem","univers":"Minecraft","titre":"Le golem de fer","texte":"Un matin, Basile découvre que des pillards approchent de son village. Les habitants n'ont aucune défense, car ils n'ont jamais eu besoin d'armes. Basile se souvient alors d'une recette : quatre blocs de fer et une citrouille permettent de créer un golem. Il court chercher du fer dans la mine, puis assemble le géant devant la porte du village. Quand les pillards arrivent, ils s'enfuient en voyant le colosse. Depuis ce jour, le golem monte la garde, et les villageois dorment tranquilles.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Il construit le golem, il cherche du fer, les pillards s'enfuient, il apprend qu'ils approchent.","Basile apprend que les pillards approchent, il cherche du fer, il construit le golem, les pillards s'enfuient.","Les pillards s'enfuient, il apprend qu'ils approchent, il construit le golem, il cherche du fer."],"a":1,"why":"Alerte, recherche du fer, construction, fuite des pillards."},{"q":"Pourquoi les villageois sont-ils sans défense ?","o":["Ils ont peur de se battre","Ils n'ont jamais eu besoin d'armes","Ils sont tous partis"],"a":1,"why":"« N'ont jamais eu besoin d'armes. »"},{"q":"De quoi Basile a-t-il besoin pour créer le golem ?","o":["Quatre blocs de fer et une citrouille","Deux blocs de pierre et une torche","Trois blocs d'or"],"a":0,"why":"« Quatre blocs de fer et une citrouille. »"},{"q":"Pourquoi les pillards s'enfuient-ils ?","o":["Ils ont perdu leur chemin","Ils entendent un bruit","Ils ont peur du colosse"],"a":2,"why":"« Ils s'enfuient en voyant le colosse. »"},{"q":"Quel est le meilleur résumé ?","o":["Des pillards détruisent un village sans défense.","Basile découvre une mine pleine de fer.","Basile sauve son village en créant un golem de fer qui fait fuir les pillards."],"a":2,"why":"Le bon résumé contient le danger, l'idée de Basile et l'issue heureuse."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-pk-grotte","univers":"Pokémon","titre":"L'orage dans la grotte","texte":"Éloïse et son frère jumeau partent en randonnée avec leurs Pokémon. En fin d'après-midi, un violent orage éclate et ils se réfugient dans une grotte. À l'intérieur, il fait noir et froid, mais le Pokémon d'Éloïse produit de petites étincelles qui éclairent les murs. Les enfants découvrent alors des dessins très anciens, gravés dans la roche. Quand la pluie s'arrête, ils prennent des photos pour les montrer au musée de la ville. Le lendemain, un archéologue vient examiner la grotte avec eux.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["L'orage éclate, ils prennent des photos, ils partent en randonnée, ils découvrent les dessins.","Ils prennent des photos, ils partent en randonnée, ils découvrent les dessins, l'orage éclate.","Ils partent en randonnée, l'orage éclate, ils découvrent les dessins, ils prennent des photos."],"a":2,"why":"Randonnée, orage, grotte et dessins, puis photos."},{"q":"Pourquoi entrent-ils dans la grotte ?","o":["Pour chercher un trésor","Pour se réfugier de l'orage","Pour dormir"],"a":1,"why":"« Ils se réfugient dans une grotte. »"},{"q":"Comment la grotte est-elle éclairée ?","o":["Avec le soleil","Avec des torches","Grâce aux étincelles du Pokémon d'Éloïse"],"a":2,"why":"« Le Pokémon d'Éloïse produit de petites étincelles. »"},{"q":"Que découvrent les enfants ?","o":["Des dessins très anciens gravés dans la roche","Un coffre rempli d'or","Une sortie secrète"],"a":0,"why":"« Des dessins très anciens, gravés dans la roche. »"},{"q":"Quel est le meilleur résumé ?","o":["Un Pokémon sauvage attaque une grotte.","Deux enfants se perdent dans la montagne.","Pendant un orage, deux jumeaux se réfugient dans une grotte et y découvrent d'anciens dessins."],"a":2,"why":"Le résumé contient l'orage, la grotte et la découverte."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-concours","univers":"Minecraft","titre":"Le concours de construction","texte":"Chaque année, le village organise un concours de construction. Cette fois, le thème est « la maison dans les nuages ». Mila décide de bâtir une maison sur une très haute colonne de terre, avec un toit en verre. Pendant la construction, un enderman la dérange et lui prend un bloc. Au lieu de se fâcher, Mila lui offre une pomme, et il s'en va. Le jury trouve sa maison très originale et lui donne la médaille d'or. Mila décide alors d'offrir la médaille à l'enderman, qui a pris la pomme avec joie.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Mila apprend le thème, elle construit, l'enderman la dérange, le jury choisit sa maison.","Elle construit, le jury choisit, elle apprend le thème, l'enderman la dérange.","Le jury choisit sa maison, l'enderman la dérange, elle apprend le thème, elle construit."],"a":0,"why":"Thème, construction, dérangement, puis vote du jury."},{"q":"Quel est le thème du concours ?","o":["La maison dans un arbre","La maison dans les nuages","La maison sous la mer"],"a":1,"why":"« La maison dans les nuages. »"},{"q":"Comment Mila réagit-elle face à l'enderman ?","o":["Elle s'enfuit","Elle le combat","Elle lui offre une pomme"],"a":2,"why":"« Au lieu de se fâcher, Mila lui offre une pomme. »"},{"q":"Que montre cette réaction ?","o":["Que Mila est paresseuse","Que Mila est calme et généreuse","Que Mila a peur"],"a":1,"why":"Elle reste gentille au lieu de s'énerver."},{"q":"Quel est le meilleur résumé ?","o":["Un enderman détruit la maison de Mila.","Mila gagne le concours avec une maison originale et reste gentille avec un enderman.","Mila perd le concours à cause d'un enderman."],"a":1,"why":"Le résumé garde l'idée du concours, la victoire et la gentillesse."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-ml-statue","univers":"Miraculous","titre":"La statue qui disparaît","texte":"Sur la place de la ville, une statue dorée de chat brille chaque matin. Un lundi, elle a disparu et les habitants sont affolés. Une jeune héroïne masquée enquête et remarque des traces de peinture dorée sur le sol. Elles la mènent jusqu'à l'atelier d'un sculpteur, qui avoue avoir emprunté la statue pour la restaurer. Il voulait faire une surprise pour l'anniversaire de la ville. L'héroïne le rassure et l'aide à rapporter la statue sur la place le soir même.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Le sculpteur avoue, la statue disparaît, l'héroïne trouve des traces, la statue revient.","La statue disparaît, l'héroïne trouve des traces, elle découvre le sculpteur, la statue revient.","La statue revient, la statue disparaît, l'héroïne trouve des traces, le sculpteur avoue."],"a":1,"why":"Disparition, indices, aveux, retour de la statue."},{"q":"Quel indice aide l'héroïne ?","o":["Un message sur un mur","Un témoin qui a tout vu","Des traces de peinture dorée sur le sol"],"a":2,"why":"« Des traces de peinture dorée sur le sol. »"},{"q":"Pourquoi le sculpteur avait-il pris la statue ?","o":["Pour la cacher","Pour la restaurer en cachette","Pour la vendre"],"a":1,"why":"« Pour la restaurer … une surprise. »"},{"q":"Comment réagit l'héroïne face au sculpteur ?","o":["Elle le rassure et l'aide","Elle appelle la police","Elle le punit"],"a":0,"why":"« L'héroïne le rassure et l'aide. »"},{"q":"Quel est le meilleur résumé ?","o":["Un voleur dérobe une statue et s'enfuit.","Une héroïne retrouve la statue disparue : un sculpteur l'avait prise pour la restaurer.","Une statue prend vie et s'échappe."],"a":1,"why":"Le résumé garde la disparition, l'explication et le retour."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-radeau","univers":"Minecraft","titre":"Le radeau","texte":"Pour atteindre une île au large, Théa et Malo décident de construire un radeau. Ils coupent des troncs, puis les attachent avec des lianes. Pendant la traversée, une vague plus forte que les autres emporte leur sac de nourriture. Malo veut faire demi-tour, mais Théa lui rappelle que l'île est plus proche que la côte. Ils ramènent donc les rames de toutes leurs forces. À l'arrivée, ils trouvent des pommiers chargés de fruits, ce qui les console de leur perte.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Une vague emporte le sac, ils trouvent des pommiers, ils construisent le radeau, ils rament.","Ils construisent le radeau, une vague emporte le sac, ils continuent de ramer, ils trouvent des pommiers.","Ils trouvent des pommiers, ils construisent le radeau, une vague emporte le sac, ils continuent de ramer."],"a":1,"why":"Construction, accident, effort, récompense."},{"q":"Avec quoi attachent-ils les troncs ?","o":["Avec des clous","Avec des lianes","Avec des cordes"],"a":1,"why":"« Les attachent avec des lianes. »"},{"q":"Pourquoi Théa refuse-t-elle de faire demi-tour ?","o":["Elle a oublié quelque chose","L'île est plus proche que la côte","Elle veut explorer"],"a":1,"why":"« L'île est plus proche que la côte. »"},{"q":"Qu'est-ce que la vague leur prend ?","o":["Leur radeau","Leurs rames","Leur sac de nourriture"],"a":2,"why":"« Emporte leur sac de nourriture. »"},{"q":"Quel est le meilleur résumé ?","o":["Un radeau est détruit par une tempête.","Deux enfants se noient pendant une traversée.","Malgré la perte de leur nourriture, deux enfants atteignent une île en radeau et y trouvent des pommes."],"a":2,"why":"Le résumé contient le but, l'obstacle et la fin."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-pk-oeuf","univers":"Pokémon","titre":"L'œuf mystérieux","texte":"Pendant les vacances, Sacha trouve un gros œuf tacheté dans l'herbe, près d'un ruisseau. Il l'enveloppe dans son pull pour le garder au chaud et le rapporte chez lui. Toute la semaine, il le surveille et lui parle doucement. Le dimanche matin, la coquille se fissure et un petit Pokémon à poils noirs en sort. Sacha lui donne un biberon de lait tiède. Il hésite à le garder, puis il décide d'appeler le centre de soins pour savoir s'il appartient à quelqu'un.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Il appelle le centre de soins, il trouve l'œuf, l'œuf éclot, il le garde au chaud.","L'œuf éclot, Sacha trouve l'œuf, il le garde au chaud, il appelle le centre de soins.","Sacha trouve l'œuf, il le garde au chaud, l'œuf éclot, il appelle le centre de soins."],"a":2,"why":"Trouvaille, soins, éclosion, appel au centre."},{"q":"Comment Sacha garde-t-il l'œuf au chaud ?","o":["Il le pose au soleil","Il le met dans un four","Il l'enveloppe dans son pull"],"a":2,"why":"« Il l'enveloppe dans son pull. »"},{"q":"Quand l'œuf éclot-il ?","o":["Pendant la nuit de mardi","Le dimanche matin","Le lundi soir"],"a":1,"why":"« Le dimanche matin, la coquille se fissure. »"},{"q":"Pourquoi Sacha appelle-t-il le centre de soins ?","o":["Pour le vendre","Pour avoir un médicament","Pour savoir si le Pokémon appartient à quelqu'un"],"a":2,"why":"« Savoir s'il appartient à quelqu'un. »"},{"q":"Quel est le meilleur résumé ?","o":["Un Pokémon sauvage vole l'œuf de Sacha.","Sacha trouve un œuf, s'en occupe toute la semaine et accueille un petit Pokémon.","Sacha perd un œuf dans l'herbe."],"a":1,"why":"Le bon résumé a la trouvaille, les soins et la naissance."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-bibli","univers":"Minecraft","titre":"La clé du temple","texte":"Nolan sait que la porte du temple de la jungle ne s'ouvre qu'avec une clé en émeraude. Il l'a vue dans un vieux livre du village. Il traverse alors la jungle, en évitant des pièges à flèches cachés dans le sol. Dans une salle secrète, il trouve la clé posée sur un piédestal. Quand il la prend, le sol tremble et un rocher roule derrière lui. Nolan court de toutes ses forces et jaillit hors de la salle au dernier moment.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Le rocher roule, Nolan lit le livre, il traverse la jungle, il prend la clé.","Nolan lit le livre, il traverse la jungle, il prend la clé, le rocher roule.","Il prend la clé, il lit le livre, le rocher roule, il traverse la jungle."],"a":1,"why":"Livre, jungle, clé, rocher."},{"q":"Comment Nolan connaît-il l'existence de la clé ?","o":["Il l'a vue dans un vieux livre","Un villageois lui en a parlé","Il l'a rêvé"],"a":0,"why":"« Il l'a vue dans un vieux livre du village. »"},{"q":"Quels dangers affronte-t-il dans la jungle ?","o":["Des loups","Des tempêtes","Des pièges à flèches cachés"],"a":2,"why":"« Des pièges à flèches cachés dans le sol. »"},{"q":"Que se passe-t-il quand il prend la clé ?","o":["Le sol tremble et un rocher roule","Une lumière s'allume","La porte s'ouvre"],"a":0,"why":"« Le sol tremble et un rocher roule derrière lui. »"},{"q":"Quel est le meilleur résumé ?","o":["Un rocher détruit le temple de la jungle.","Nolan traverse la jungle, trouve la clé du temple et échappe de justesse à un rocher.","Nolan se perd dans la jungle."],"a":1,"why":"Le résumé garde le but, le piège et la fuite."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-ml-concert","univers":"Miraculous","titre":"Le concert annulé","texte":"Le grand concert de l'école doit commencer à dix-huit heures. À dix-sept heures, Lisa apprend que la chanteuse principale est enrouée et ne peut plus chanter. Toute la classe est bouleversée, car les parents sont déjà dans la salle. Lisa, qui connaît toutes les chansons par cœur, propose de la remplacer. Elle est très timide, mais ses amis l'encouragent. Sur scène, sa voix tremble au début, puis elle se détend et chante avec bonheur. À la fin, la salle l'applaudit debout.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["La salle l'applaudit, Lisa apprend le problème, elle chante, elle propose de remplacer la chanteuse.","Lisa apprend le problème, elle propose de remplacer la chanteuse, elle chante, la salle l'applaudit.","Elle chante, la salle l'applaudit, elle apprend le problème, elle propose de remplacer la chanteuse."],"a":1,"why":"Problème, proposition, chant, applaudissements."},{"q":"Pourquoi la chanteuse ne peut-elle pas chanter ?","o":["Elle est en retard","Elle a oublié ses paroles","Elle est enrouée"],"a":2,"why":"« La chanteuse principale est enrouée. »"},{"q":"Pourquoi Lisa peut-elle la remplacer ?","o":["Elle a déjà chanté sur scène","Elle connaît toutes les chansons par cœur","Elle est la meilleure de la classe"],"a":1,"why":"« Elle connaît toutes les chansons par cœur. »"},{"q":"Comment Lisa se sent-elle en commençant à chanter ?","o":["Fâchée","Très sûre d'elle","Stressée : sa voix tremble"],"a":2,"why":"« Sa voix tremble au début. »"},{"q":"Quel est le meilleur résumé ?","o":["Lisa, timide, remplace la chanteuse malade au concert et réussit sa prestation.","Lisa perd sa voix pendant le concert.","Le concert est annulé à cause d'une grippe."],"a":0,"why":"Le bon résumé contient le problème, le courage de Lisa et la réussite."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-vq-velo","univers":"Vie de tous les jours","titre":"Le vélo crevé","texte":"Samedi, Nora et son frère Karim partent en vélo vers l'étang, à dix kilomètres de la maison. À mi-chemin, le pneu de Karim crève sur un morceau de verre. Karim est découragé et veut rentrer à pied. Nora, elle, se souvient que son père lui a appris à réparer une chambre à air, et que la trousse d'outils est dans son sac. Elle retire la roue, trouve le trou, colle une rustine et regonfle le pneu avec la pompe. Karim la regarde faire, impressionné. Une demi-heure plus tard, ils repartent et arrivent à l'étang pour pique-niquer.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Le pneu crève, Nora se souvient de la réparation, elle répare, ils repartent.","Ils arrivent à l'étang, le pneu crève, Nora répare, ils rentrent.","Nora répare, le pneu crève, Karim est découragé, ils repartent."],"a":0,"why":"D'abord le pneu crève, puis Nora répare, puis ils repartent."},{"q":"Pourquoi Karim veut-il rentrer à pied ?","o":["Il est découragé","Il est fatigué de pique-niquer","Il a perdu son sac"],"a":0,"why":"« Karim est découragé. »"},{"q":"Comment Nora sait-elle réparer le pneu ?","o":["Son père lui a appris","Un passant l'aide","Elle l'a lu dans un livre"],"a":0,"why":"« Son père lui a appris à réparer une chambre à air. »"},{"q":"« Impressionné » veut dire :","o":["endormi","en colère","très surpris et admiratif"],"a":2,"why":"Karim admire ce que fait sa sœur."},{"q":"Quel est le meilleur résumé ?","o":["Nora et Karim se disputent sur la route.","Karim perd son vélo en rentrant.","Nora répare le vélo de son frère pendant une sortie, et ils arrivent à l'étang."],"a":2,"why":"Le bon résumé contient le problème, la solution et la fin."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-vq-voisin","univers":"Vie de tous les jours","titre":"Le nouveau voisin","texte":"Un nouveau voisin, monsieur Perret, emménage dans l'appartement du dessous. Il porte seul des cartons très lourds dans l'escalier. Émilie, qui rentre de l'école, hésite un instant, car elle est timide. Puis elle propose de lui tenir la porte. Reconnaissant, monsieur Perret lui offre un paquet de biscuits. Le lendemain, Émilie glisse un mot de bienvenue sous sa porte, et il lui répond d'un grand sourire dans l'escalier.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Elle écrit un mot, elle hésite, il lui offre des biscuits, elle tient la porte.","Émilie hésite, elle tient la porte, il lui offre des biscuits, elle écrit un mot.","Il lui offre des biscuits, elle hésite, elle écrit un mot, elle tient la porte."],"a":1,"why":"Elle hésite d'abord, car elle est timide."},{"q":"Pourquoi Émilie hésite-t-elle ?","o":["Elle est timide","Elle est pressée","Elle a peur des cartons"],"a":0,"why":"« Elle hésite, car elle est timide. »"},{"q":"Pourquoi monsieur Perret offre-t-il des biscuits ?","o":["Parce que c'est son anniversaire","Pour la remercier","Pour la punir"],"a":1,"why":"« Reconnaissant, il lui offre des biscuits. »"},{"q":"« Emménager » veut dire :","o":["faire le ménage","s'installer dans un nouveau logement","quitter sa maison"],"a":1,"why":"Emménager, c'est venir habiter quelque part."},{"q":"Quel est le meilleur résumé ?","o":["Une petite fille timide aide un nouveau voisin, et ils deviennent amicaux.","Émilie perd ses clés dans l'escalier.","Monsieur Perret déménage parce qu'il est fâché."],"a":0,"why":"Le bon résumé dit qui, ce qui se passe et comment ça finit."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-vq-panne","univers":"Vie de tous les jours","titre":"La panne de courant","texte":"Un soir d'orage, toutes les lumières de l'immeuble s'éteignent d'un coup. Mathis, six ans, pleure parce qu'il a peur du noir. Sa grande sœur Lucie cherche une lampe de poche dans le tiroir de la cuisine, mais les piles sont vides. Elle allume alors des bougies dans des verres et lui lit une histoire. Rassuré, Mathis s'endort avant que l'électricité revienne.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Les lumières s'éteignent, Lucie cherche la lampe, elle allume des bougies, Mathis s'endort.","Mathis s'endort, les lumières s'éteignent, Lucie allume des bougies, elle cherche la lampe.","Lucie lit une histoire, la lampe marche, les lumières s'éteignent, Mathis pleure."],"a":0,"why":"D'abord la panne, ensuite les recherches."},{"q":"Pourquoi Mathis pleure-t-il ?","o":["Il a peur du noir","Il est tombé","Il a faim"],"a":0,"why":"« Il a peur du noir. »"},{"q":"Pourquoi Lucie n'utilise-t-elle pas la lampe de poche ?","o":["Elle est cassée","Les piles sont vides","Elle ne la trouve pas"],"a":1,"why":"« Les piles sont vides. »"},{"q":"« Rassuré » veut dire :","o":["il n'a plus peur","il a plus peur","il est puni"],"a":0,"why":"Rassurer, c'est calmer la peur."},{"q":"Quel est le meilleur résumé ?","o":["Lucie a peur du noir et pleure.","Pendant une panne de courant, Lucie calme son petit frère avec des bougies et une histoire.","Un orage casse la maison de Mathis."],"a":1,"why":"Le bon résumé parle de la panne, de Lucie et de Mathis rassuré."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-mc-citrouilles","univers":"Minecraft","titre":"Le champ de citrouilles","texte":"Alex veut préparer un gâteau pour fêter l'anniversaire de son village, mais il lui manque des citrouilles. Il sait que le champ est de l'autre côté de la rivière. D'abord, il construit un petit bateau avec des planches de chêne. Ensuite, il traverse et remplit son sac de citrouilles. Au retour, un creeper s'approche, mais Alex le voit et s'éloigne à temps. Le soir, le gâteau est prêt et tout le village chante.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Il remplit son sac, il traverse, il construit un bateau, le gâteau est prêt.","Il construit un bateau, il traverse, il remplit son sac, il évite un creeper.","Il évite un creeper, il construit un bateau, il remplit son sac, il traverse."],"a":1,"why":"D'abord le bateau, ensuite la traversée."},{"q":"Pourquoi Alex a-t-il besoin de citrouilles ?","o":["Pour construire un bateau","Pour faire un gâteau","Pour nourrir un loup"],"a":1,"why":"« Il veut préparer un gâteau. »"},{"q":"Pourquoi construit-il un bateau ?","o":["Pour pêcher","Pour dormir","Pour traverser la rivière"],"a":2,"why":"Le champ est de l'autre côté de la rivière."},{"q":"Que fait Alex quand le creeper approche ?","o":["Il l'attaque","Il se cache dans le bateau","Il s'éloigne à temps"],"a":2,"why":"« Alex le voit et s'éloigne à temps. »"},{"q":"Quel est le meilleur résumé ?","o":["Un creeper détruit le village d'Alex.","Alex traverse la rivière pour rapporter des citrouilles et prépare un gâteau pour son village.","Alex perd son bateau dans la rivière."],"a":1,"why":"Le bon résumé donne le but, le chemin et la fin."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."},{"id":"3-pk-timide","univers":"Pokémon","titre":"Le Pokémon timide","texte":"Lola a adopté un petit Pokémon psychique très timide. Chaque fois que des enfants s'approchent, il se cache derrière ses jambes. Lola ne le force jamais. Elle s'assoit simplement sur un banc avec lui et attend. Peu à peu, le Pokémon observe les autres enfants jouer. Au bout de plusieurs semaines, il avance de lui-même vers une petite fille et lui offre une fleur. Lola sourit : son compagnon a fait le premier pas.","qs":[{"q":"Quel est le bon ordre des événements ?","o":["Il se cache, il observe les autres, il avance, il offre une fleur.","Il offre une fleur, il se cache, il observe, il avance.","Il avance, il se cache, il offre une fleur, il observe."],"a":0,"why":"D'abord, il se cache."},{"q":"Pourquoi le Pokémon se cache-t-il ?","o":["Il a faim","Il est timide","Il est malade"],"a":1,"why":"« Un petit Pokémon très timide. »"},{"q":"Que fait Lola pour l'aider ?","o":["Elle le pousse vers les enfants","Elle l'attend sans le forcer","Elle le laisse seul"],"a":1,"why":"« Lola ne le force jamais. »"},{"q":"« Faire le premier pas » veut dire :","o":["marcher le plus vite","partir en courant","commencer le premier à aller vers l'autre"],"a":2,"why":"C'est oser s'approcher le premier."},{"q":"Quel est le meilleur résumé ?","o":["Lola gronde son Pokémon.","Grâce à la patience de Lola, son Pokémon timide ose enfin aller vers les autres.","Un Pokémon se perd dans un parc."],"a":1,"why":"Le bon résumé parle de la timidité et de la patience."}],"ecrit":"Écris deux phrases pour résumer l'histoire avec tes mots."}],"4":[{"id":"4-mc-village-silence","univers":"Minecraft","titre":"Le village silencieux","texte":"Maya arrive dans un village où tous les habitants sont enfermés chez eux, volets baissés. Au centre, un panneau en bois porte une inscription tracée à la hâte : « Ne sortez pas à la nuit tombée ». Des traces de pas griffues mènent vers la forêt. Maya remarque aussi que les champs de blé sont intacts alors que toutes les citrouilles ont disparu. Elle sort ses blocs de pierre et construit une tour de guet. Au crépuscule, elle y monte, l'arc à la main.","qs":[{"q":"Que peut-on deviner du comportement des habitants ?","o":["Ils sont partis en voyage","Ils ont peur d'une créature qui sort la nuit","Ils font la fête"],"a":1,"why":"Le panneau et les volets baissés montrent leur peur."},{"q":"Quelle phrase prouve que le danger arrive le soir ?","o":["« Ne sortez pas à la nuit tombée »","« Maya arrive dans un village »","« Elle sort ses blocs de pierre »"],"a":0,"why":"Le panneau parle de la nuit tombée."},{"q":"« Tracée à la hâte » veut dire :","o":["écrite très vite","écrite très lentement","effacée"],"a":0,"why":"À la hâte, c'est dans la précipitation."},{"q":"Pourquoi Maya construit-elle une tour de guet ?","o":["Pour cacher les citrouilles","Pour surveiller ce qui arrive","Pour dormir"],"a":1,"why":"Elle monte au crépuscule, l'arc à la main : elle guette."},{"q":"Quel est le meilleur titre pour résumer l'histoire ?","o":["Maya se prépare à affronter le danger du village","Le champ de blé","Le village en fête"],"a":0,"why":"Le titre doit dire l'essentiel."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-mc-piege-coffre","univers":"Minecraft","titre":"Le piège du coffre","texte":"Léon découvre un coffre posé au milieu d'une pièce vide, sur une plaque de pierre. Il s'approche, puis s'arrête : le sol autour du coffre est un peu plus clair que le reste. Un fil presque invisible traverse la pièce à hauteur de cheville. Léon ramasse une pomme de terre et la lance sur la plaque. Un déclic retentit et des flèches jaillissent du mur. Il sourit, contourne la plaque et ouvre le coffre sans risque.","qs":[{"q":"Pourquoi Léon s'arrête-t-il ?","o":["Il remarque des indices d'un piège","Il entend un bruit de loup","Il est fatigué"],"a":0,"why":"Le sol clair et le fil lui font comprendre qu'il y a un piège."},{"q":"Pourquoi lance-t-il une pomme de terre sur la plaque ?","o":["Pour la casser","Pour tester la plaque sans danger","Pour nourrir un animal"],"a":1,"why":"Le déclic prouve que la plaque déclenche le piège."},{"q":"« Un déclic » est :","o":["un cri","une odeur","un petit bruit sec de mécanisme"],"a":2,"why":"Un déclic est le bruit d'un mécanisme qui se déclenche."},{"q":"Que se serait-il passé s'il avait marché sur la plaque ?","o":["Les flèches l'auraient touché","Le coffre se serait ouvert","Rien"],"a":0,"why":"Les flèches jaillissent quand la plaque est touchée."},{"q":"Quel trait de Léon montre cette histoire ?","o":["Il est distrait","Il est prudent et observateur","Il est pressé et brutal"],"a":1,"why":"Il remarque les détails et teste avant d'agir."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-mc-deux-villages","univers":"Minecraft","titre":"Le pont entre deux villages","texte":"Deux villages sont séparés par une rivière. Autrefois, un pont les reliait, mais il s'est écroulé et chaque village accuse l'autre de l'avoir cassé. Depuis, plus personne ne se parle. Un matin, Noé, un jeune villageois, remarque que le bois des piles est rongé par l'humidité. Il comprend que personne n'est coupable : le pont est simplement vieux. Il invite les deux chefs à venir voir et leur propose de le reconstruire ensemble. Ils acceptent, un peu gênés.","qs":[{"q":"Que comprend Noé en observant le bois ?","o":["Un monstre l'a détruit","Le pont est tombé parce qu'il était usé","Un village l'a cassé exprès"],"a":1,"why":"Le bois est rongé par l'humidité."},{"q":"Quelle phrase montre que personne n'est coupable ?","o":["« Le pont est simplement vieux. »","« Ils acceptent. »","« Plus personne ne se parle. »"],"a":0,"why":"C'est la conclusion de Noé."},{"q":"Pourquoi les chefs sont-ils « un peu gênés » ?","o":["Ils ont froid","Ils sont pressés","Ils ont accusé l'autre à tort"],"a":2,"why":"Ils comprennent qu'ils se sont trompés."},{"q":"« Accuser » veut dire :","o":["féliciter","dire que quelqu'un est responsable d'une faute","aider"],"a":1,"why":"Accuser, c'est reprocher une faute."},{"q":"Quel est le message de l'histoire ?","o":["Il faut éviter les rivières","Les ponts sont dangereux","Il vaut mieux chercher la cause avant d'accuser"],"a":2,"why":"Noé trouve la vraie cause avant de blâmer."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-mc-baton-mystere","univers":"Minecraft","titre":"L'étrange bâton","texte":"En explorant un temple abandonné, Jade trouve un bâton orné de petits symboles. Elle le range dans son sac sans bien comprendre. Plus tard, devant une porte de fer, ses symboles se mettent à briller et la porte s'ouvre toute seule. Jade se retourne : elle est certaine que personne n'a touché au mécanisme. Elle comprend que le bâton est une clé. Elle le serre contre elle et avance prudemment dans la salle.","qs":[{"q":"Que comprend Jade à la fin ?","o":["La porte est fausse","Le bâton sert de clé","Le bâton est cassé"],"a":1,"why":"Les symboles brillent et la porte s'ouvre."},{"q":"Quel indice lui fait penser cela ?","o":["La porte s'ouvre quand les symboles brillent","Elle a trouvé le bâton dans un temple","Elle est prudente"],"a":0,"why":"Les symboles brillent juste avant l'ouverture."},{"q":"« Orné » veut dire :","o":["lourd","décoré","cassé"],"a":1,"why":"Orné de symboles : décoré de symboles."},{"q":"Pourquoi Jade avance-t-elle « prudemment » ?","o":["Elle ne sait pas ce qu'elle va trouver","Elle a perdu le bâton","Elle est fatiguée"],"a":0,"why":"Une salle inconnue peut cacher un danger."},{"q":"Vrai ou faux : Jade savait dès le début que le bâton était une clé.","o":["Vrai","Faux"],"a":1,"why":"Elle le range « sans bien comprendre »."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-pk-champion","univers":"Pokémon","titre":"Le champion fatigué","texte":"Avant le combat, Théo remarque que son adversaire, un champion réputé, bâille sans cesse et que son Pokémon bouge lentement. Au lieu de se jeter sur lui, Théo choisit d'esquiver les attaques et d'attendre. Au bout de quelques minutes, le Pokémon adverse ralentit encore. Théo contre-attaque alors, et gagne en quelques secondes. Le champion lui serre la main : il avoue n'avoir presque pas dormi la veille.","qs":[{"q":"Pourquoi Théo décide-t-il d'esquiver au début ?","o":["Il a vu que l'adversaire était fatigué","Il a peur","Il a oublié ses attaques"],"a":0,"why":"L'adversaire bâille et son Pokémon est lent."},{"q":"Que révèle la dernière phrase ?","o":["Théo a triché","La fatigue de l'adversaire expliquait sa lenteur","Le champion était en colère"],"a":1,"why":"Il avoue n'avoir presque pas dormi."},{"q":"« Réputé » veut dire :","o":["connu et estimé","inconnu","très jeune"],"a":0,"why":"Un champion réputé a une bonne réputation."},{"q":"Quelle qualité Théo montre-t-il ?","o":["Il sait observer et être patient","Il est distrait","Il est brutal"],"a":0,"why":"Il attend le bon moment."},{"q":"Quel est le meilleur titre ?","o":["Gagner en observant avant d'agir","Un combat perdu","Le Pokémon disparu"],"a":0,"why":"Il gagne grâce à son observation."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-pk-oeuf-froid","univers":"Pokémon","titre":"L'œuf qui ne s'ouvre pas","texte":"Depuis trois semaines, Maëlle garde un œuf de Pokémon au chaud dans son sac. Il ne se passe rien, et ses amis commencent à se moquer d'elle. Un soir, elle découvre que son sac était toujours posé près d'une fenêtre ouverte. Elle comprend que l'œuf avait trop froid la nuit. Elle l'enveloppe dans une écharpe et le pose près du radiateur. Le lendemain matin, une petite fissure apparaît sur la coquille.","qs":[{"q":"Que comprend Maëlle un soir ?","o":["Ses amis ont raison","L'œuf avait froid la nuit","L'œuf est vide"],"a":1,"why":"Le sac était près d'une fenêtre ouverte."},{"q":"Quelle phrase prouve qu'elle change de méthode ?","o":["« Depuis trois semaines »","« Elle l'enveloppe dans une écharpe »","« Ses amis se moquent d'elle »"],"a":1,"why":"Elle réchauffe l'œuf."},{"q":"« Une fissure » est :","o":["un trou énorme","une petite fente","une tache"],"a":1,"why":"Une fissure est une fine fente dans la coquille."},{"q":"Comment Maëlle se sent-elle au début ?","o":["Très fière","Découragée et un peu humiliée","Indifférente"],"a":1,"why":"Ses amis se moquent d'elle et rien ne se passe."},{"q":"Quel est le meilleur titre ?","o":["Chercher pourquoi ça ne marche pas","Un radiateur en panne","Une fenêtre cassée"],"a":0,"why":"Elle cherche la cause et trouve une solution."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-ml-ecole-secret","univers":"Miraculous","titre":"Le retard de Mia","texte":"Depuis une semaine, Mia arrive en retard à l'école, essoufflée, les joues rouges. Sa maîtresse la gronde, et ses camarades haussent les épaules. Mia ne donne aucune explication. Un matin, Sam, son voisin de table, la voit sortir en courant d'une ruelle, un petit sac cousu d'étoiles à la main. Quelques minutes plus tôt, il avait vu un grand héros masqué disparaître au même endroit. Sam ne dit rien à personne. Le lendemain, il glisse simplement un mot à Mia : « Pour demain, je te prête mon réveil. »","qs":[{"q":"Que devine Sam ?","o":["Mia a perdu son sac","Mia est malade","Mia est l'héroïne masquée"],"a":2,"why":"Il voit Mia sortir de la ruelle où le héros disparaît."},{"q":"Quel indice appuie cette idée ?","o":["Mia est essoufflée","La maîtresse la gronde","Le héros disparaît au même endroit que Mia apparaît"],"a":2,"why":"Le lieu et le moment correspondent."},{"q":"Pourquoi Sam ne dit-il rien à personne ?","o":["Il veut protéger le secret de Mia","Il a peur de la maîtresse","Il ne comprend rien"],"a":0,"why":"Il l'aide discrètement avec le mot."},{"q":"« Essoufflée » veut dire :","o":["qui manque de souffle après avoir couru","très calme","endormie"],"a":0,"why":"Essoufflée : respire vite après un effort."},{"q":"Quel est le meilleur titre ?","o":["Le réveil cassé","Une punition injuste","Sam garde le secret de Mia"],"a":2,"why":"Il découvre le secret et reste discret."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-ml-fete-surprise","univers":"Miraculous","titre":"La fête surprise","texte":"Pour l'anniversaire de leur amie Zoé, Karim et Léa préparent une fête secrète dans le jardin. Zoé les trouve étranges toute la semaine : ils chuchotent, changent de sujet quand elle arrive et refusent de lui dire où ils vont après l'école. Vexée, elle pense qu'ils lui cachent quelque chose de grave. Le samedi, elle est sur le point de rentrer chez elle en pleurant quand elle ouvre le portail du jardin. Des ballons et un grand gâteau l'attendent.","qs":[{"q":"Pourquoi Zoé est-elle vexée ?","o":["Elle a perdu un jeu","Elle est en retard","Elle croit que ses amis lui cachent quelque chose"],"a":2,"why":"Ils chuchotent et changent de sujet devant elle."},{"q":"Quelle est la vraie raison du comportement de Karim et Léa ?","o":["Ils préparent une surprise","Ils ont un secret grave","Ils sont fâchés"],"a":0,"why":"La fête est secrète."},{"q":"« Vexée » veut dire :","o":["très contente","blessée dans son amour-propre","effrayée"],"a":1,"why":"On est vexé quand on se sent mis à l'écart."},{"q":"Que ressent Zoé à la fin ?","o":["Surprise et soulagée","Furieuse","Ennuyée"],"a":0,"why":"Elle pleurait presque et découvre la fête."},{"q":"Quel est le message de l'histoire ?","o":["Les apparences peuvent tromper","Il ne faut jamais sortir","Les secrets sont toujours graves"],"a":0,"why":"Zoé se trompait sur les intentions de ses amis."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-vq-devoirs","univers":"Vie de tous les jours","titre":"Les devoirs oubliés","texte":"Lundi matin, Inès ouvre son cartable et pâlit : son cahier de maths n'y est plus. Elle se souvient l'avoir posé sur la table du salon, sous un journal, pendant que sa mère préparait le déjeuner. À l'école, la maîtresse demande les cahiers. Inès baisse les yeux, hésite, puis lève la main et explique franchement ce qui s'est passé. La maîtresse, au lieu de la punir, lui propose de rapporter son cahier demain, avec un petit mot de ses parents. Inès respire enfin.","qs":[{"q":"Pourquoi Inès « pâlit » ?","o":["Elle a froid","Elle est malade","Elle a peur d'être punie"],"a":2,"why":"Elle découvre qu'il manque son cahier."},{"q":"Où se trouve probablement le cahier ?","o":["À l'école","Sur la table du salon, sous un journal","Dans le sac d'un camarade"],"a":1,"why":"Elle s'en souvient elle-même."},{"q":"Pourquoi la maîtresse ne la punit-elle pas ?","o":["Elle est absente","Inès a dit la vérité franchement","Elle a oublié"],"a":1,"why":"Inès explique « franchement » ce qui s'est passé."},{"q":"« Franchement » veut dire :","o":["en riant","en cachant","en disant la vérité"],"a":2,"why":"Parler franchement, c'est dire la vérité."},{"q":"Quel est le meilleur titre ?","o":["Un cartable trop lourd","Dire la vérité sauve Inès d'une punition","La maîtresse en colère"],"a":1,"why":"Elle avoue et la maîtresse comprend."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-vq-chat-perdu","univers":"Vie de tous les jours","titre":"Le chat du quartier","texte":"Depuis trois jours, l'affiche « Chat perdu » est collée sur le mur de l'école. Un matin, Adèle remarque qu'un chat gris traîne toujours près de la boulangerie, le ventre creux, avec un collier rouge. Elle le caresse et lit le petit médaillon : un numéro de téléphone. Elle n'a pas de portable, alors elle demande à la boulangère de téléphoner. Une heure plus tard, un petit garçon arrive en courant et serre le chat dans ses bras. Adèle reçoit un grand merci et un croissant tout chaud.","qs":[{"q":"Comment Adèle comprend-elle que c'est le chat de l'affiche ?","o":["Il la suit à l'école","Il miaule fort","Il est gris, avec un collier rouge et un médaillon"],"a":2,"why":"Les indices correspondent à l'affiche et au médaillon."},{"q":"Pourquoi demande-t-elle à la boulangère de téléphoner ?","o":["Elle n'a pas de portable","Elle est pressée","Elle a peur du chat"],"a":0,"why":"« Elle n'a pas de portable. »"},{"q":"« Le ventre creux » veut dire :","o":["qui a faim","qui a trop mangé","qui est malade"],"a":0,"why":"Un ventre creux, c'est un ventre vide."},{"q":"Que ressent le petit garçon ?","o":["Une grande joie","De l'ennui","De la colère"],"a":0,"why":"Il serre le chat dans ses bras."},{"q":"Quel est le meilleur titre ?","o":["Une affiche arrachée","Un croissant volé","Adèle retrouve le propriétaire du chat"],"a":2,"why":"Elle fait le lien entre l'affiche et le chat."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-vq-tri","univers":"Vie de tous les jours","titre":"Le tri des déchets","texte":"À la cantine, la classe de Rayan jette tout dans la même poubelle. Un jour, la directrice leur montre une vidéo : les déchets non triés finissent dans un grand trou, alors que les bouteilles en plastique, bien triées, deviennent des pulls. Rayan réfléchit longtemps. Dès le lendemain, il colle des étiquettes colorées sur trois bacs et explique les règles à ses camarades. En fin de semaine, la poubelle grise est à moitié vide et les bacs de tri sont pleins.","qs":[{"q":"Qu'est-ce qui pousse Rayan à agir ?","o":["Une punition","La vidéo de la directrice","Un jeu"],"a":1,"why":"La vidéo montre l'intérêt du tri."},{"q":"Que peut-on déduire de la fin du texte ?","o":["Les élèves ont arrêté de jeter","Les élèves ont adopté le tri","La cantine a fermé"],"a":1,"why":"La poubelle grise est à moitié vide."},{"q":"« Trier » veut dire :","o":["mélanger","jeter à la poubelle","séparer selon le type"],"a":2,"why":"Trier, c'est classer par catégories."},{"q":"Quelle qualité Rayan montre-t-il ?","o":["Il est timide","Il est paresseux","Il prend l'initiative"],"a":2,"why":"Il colle les étiquettes et explique les règles."},{"q":"Quel est le meilleur titre ?","o":["Un élève change les habitudes de la cantine","Une vidéo ennuyeuse","Une poubelle cassée"],"a":0,"why":"Rayan lance le tri à la cantine."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."},{"id":"4-vq-premier-jour","univers":"Vie de tous les jours","titre":"Le premier jour au club de natation","texte":"Sofia entre pour la première fois dans le grand bassin du club. Elle serre sa serviette contre elle et regarde l'eau avec un air inquiet. Autour d'elle, les autres enfants plongent sans hésiter. Le moniteur, voyant son visage, s'accroupit près d'elle et dit doucement : « Tu peux descendre par l'échelle, il n'y a aucune honte à ça. » Sofia respire, met un pied dans l'eau, puis l'autre. Dix minutes plus tard, elle nage, un grand sourire aux lèvres.","qs":[{"q":"Que ressent Sofia au début ?","o":["De la joie","De la colère","De l'inquiétude"],"a":2,"why":"Elle serre sa serviette et regarde l'eau avec inquiétude."},{"q":"Pourquoi le moniteur lui parle-t-il doucement ?","o":["Il a compris qu'elle avait peur","Il est fâché","Il est pressé"],"a":0,"why":"Il voit son visage inquiet."},{"q":"Que veut dire « il n'y a aucune honte à ça » ?","o":["Elle doit partir","Ce n'est pas grave de faire autrement","Il faut plonger vite"],"a":1,"why":"Le moniteur la rassure."},{"q":"Quelle phrase montre que Sofia est maintenant rassurée ?","o":["« Elle serre sa serviette »","« Les autres plongent »","« Un grand sourire aux lèvres »"],"a":2,"why":"Le sourire montre sa joie."},{"q":"Quel est le meilleur titre ?","o":["Un moniteur aide Sofia à vaincre sa peur","Une serviette perdue","Un bassin fermé"],"a":0,"why":"Le moniteur rassure Sofia."}],"ecrit":"Écris deux phrases : ce que le personnage comprend ou ressent, puis une phrase du texte qui le prouve."}]};

function Q(q, o, a, why) { return { q: q, o: o, a: a, why: why }; }
var FR_G1 = { id: "g1", titre: "G1 · Les groupes dans la phrase", poids: 1,
  resume: "Le groupe sujet est un groupe indispensable. Il répond à la question : De qui ? De quoi je parle ?\n\nLe groupe verbal est un groupe indispensable. Il répond à la question : Qu'est-ce que je dis ?\n\nLe groupe complément répond aux questions : Quand ? Comment ? Où ? Il est supprimable et déplaçable." + NOTE_LECON,
  exos: [ { titre: "Repérer les groupes", qs: [
    Q("Dans « Le tigre chasse dans la jungle », quel est le groupe sujet ?", ["Le tigre", "chasse", "dans la jungle"], 0, "Le groupe sujet répond à : de qui je parle ? Je parle du tigre."),
    Q("Dans « Mon frère mange une pomme ce soir », quel groupe est supprimable et déplaçable ?", ["ce soir", "Mon frère", "mange une pomme"], 0, "« ce soir » répond à Quand ? On peut le supprimer ou le déplacer."),
    Q("Le groupe sujet répond à la question :", ["De qui ou de quoi je parle ?", "Quand ?", "Où ?"], 0, "C'est la question du groupe sujet."),
    Q("Vrai ou faux : le groupe sujet est indispensable.", VF, 0, "On ne peut pas le supprimer."),
    Q("Vrai ou faux : on peut supprimer le groupe verbal sans changer le sens.", VF, 1, "Le groupe verbal est indispensable aussi."),
    Q("« Hier, Léa a mangé une glace. » Quel groupe peut changer de place ?", ["Hier", "Léa", "a mangé"], 0, "Le complément « Hier » est déplaçable : Léa a mangé une glace hier."),
    Q("Un groupe complément répond à :", ["Quand ? Comment ? Où ?", "Qui est-ce qui ?", "Que dit-on ?"], 0, "Ce sont les questions du complément.")
  ] } ] };
var FR_G2 = { id: "g2", titre: "G2 · Le sujet", poids: 1,
  resume: "Le sujet est un mot ou un groupe de mots. Il est :\n- un groupe nominal (GN)\n- un nom propre\n- un pronom personnel\n- un verbe à l'infinitif.\n\nLe groupe sujet est indispensable. Il n'est pas toujours placé devant le groupe verbal. Il commande le verbe : on dit que le sujet et le verbe s'accordent.\n\nExemple : Le tigre chasse. → Il chasse.\n\nPour trouver le sujet, on peut s'aider de la formule « Qui est-ce qui ? ».\nExemple : Qui est-ce qui aime chasser ? C'est le tigre qui aime chasser." + NOTE_LECON,

var FR_G4 = { id: "g4", titre: "G4 · La ponctuation", poids: 1,
  resume: "La ponctuation aide à comprendre une phrase ou un texte. Les différents signes nous indiquent quel ton adopter et où faire des pauses courtes ou plus longues.\n\n- Le point se place à la fin d'une phrase qui donne une information. L'intonation est descendante.\n- Le point d'interrogation se place à la fin de la phrase qui est une question. L'intonation est montante.\n- Le point d'exclamation se place à la fin d'une phrase qui indique une émotion ou un sentiment. L'intonation est montante.\n- Les points de suspension se placent à la fin d'une phrase, indiquant une suite possible.\n- La virgule sépare les mots d'une énumération (action, objet). Elle se place dans la phrase. On marque une courte pause.\n- Les deux points introduisent un dialogue ou une énumération.\n- Le tiret indique quelqu'un qui parle et le changement d'interlocuteur.\n- Les guillemets introduisent un dialogue ou une citation." + NOTE_LECON,

  resume: "Le présent est un temps. On peut s'appuyer sur le mot « maintenant » pour le conjuguer.\n\nLe présent est formé d'un radical (c'est la forme infinitive dont la terminaison -er est enlevée) et d'une terminaison : -e, -es, -e, -ons, -ez, -ent.\n\nLes verbes être et avoir ont des formes conjuguées propres pour chaque pronom personnel.\nÊTRE : je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.\nAVOIR : j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.\n\nAttention à l'orthographe de certaines formes :\n- La cédille marque le son [s] avec nous : nous plaçons, nous lançons.\n- Les verbes en -ger gardent un e avec nous : nous mangeons, nous protégeons, nous bougeons, nous jugeons.\n- Certains verbes en -eler et -eter doublent le l ou le t devant un e muet : je m'appelle, je jette (et les verbes de la même famille)." + NOTE_LECON,

function planN() { return (state.plan && state.plan.n) || PLAN_JOURS; }
function buildPlan() {
  ensurePlan();
  var p = itemsQuiz(), rand = rngSeed("plan:" + state.plan.start);
  var seqMain = [], seqAutres = [], besoin = PLAN_MAX * PLAN_PAR_JOUR + 20;
  while (p.main.length && seqMain.length < besoin) { seqMain = seqMain.concat(melangeTab(p.main, rand)); }
  while (p.autres.length && seqAutres.length < besoin) { seqAutres = seqAutres.concat(melangeTab(p.autres, rand)); }
  var pm = 0, pa = 0, jours = [];
  for (var d = 0; d < planN(); d++) {
    var jour = [], vus = {}, essais = 0;
    while (jour.length < PLAN_PAR_JOUR && essais < 300) {
      essais++;
      var it;
      if (seqAutres.length && (!seqMain.length || rand() < 0.1)) { it = seqAutres[pa % seqAutres.length]; pa++; }
      else if (seqMain.length) { it = seqMain[pm % seqMain.length]; pm++; }
      else { break; }
      if (vus[cleItem(it)]) { continue; }
      vus[cleItem(it)] = 1;
      jour.push(it);
    }

}
/* Quiz du jour : les questions prévues au plan + des rappels sur les points faibles, jusqu'à 10 */
function buildDailyQuiz() {
  var plan = buildPlan(), idx = Math.min(state.plan.done || 0, planN() - 1);
  var jour = plan[idx] || [], out = [], vus = {}, k;
  for (k = 0; k < jour.length; k++) { out.push(questionDe(jour[k])); vus[cleItem(jour[k])] = 1; }
  var p = itemsQuiz(), rand = Math.random, garde = 0;
  while (out.length < NB_QUIZ && garde < 600) {
    garde++;
    var pool = p.main;
    if (p.autres.length > 0 && (p.main.length === 0 || rand() < 0.1)) { pool = p.autres; }
    if (pool.length === 0) { break; }
    var it = pool[tirerPondere(pool, rand)];
    if (vus[cleItem(it)]) { continue; }

}

function finishEx() {
  var ex = cur.ex, ctx = cur.ctx;
  var s = pct10(cur.correct, ex.qs.length);
  var info = { s: s, monte: false, termine: false };
  if (ctx.kind === "comp") {
    var c = state.comp;
    if (s >= 9) { c.streak = 2; c.low = 0; }
    else if (s >= 8) { c.streak++; c.low = 0; } else if (s < 5) { c.low = (c.low || 0) + 1; c.streak = 0; } else { c.streak = 0; c.low = 0; }
    if (c.streak >= 2) {
      if (c.level < COMP_LEVELS.length) { c.level++; c.streak = 0; info.monte = true; }
      else { info.termine = true; }
    } else if (c.low >= 2 && c.level > 1) { c.level--; c.low = 0; c.streak = 0; }
    c.pos[String(ctx.lvl)] = (c.pos[String(ctx.lvl)] || 0) + 1;
    c.last = isoToday();
  }
  if (ctx.kind === "quiz" || ctx.kind === "genre") {
    var qz = (ctx.kind === "quiz") ? state.quiz : state.genre;
    var premier = (qz.last !== isoToday());
    if (premier) {
      qz.streak = (qz.last === isoHier()) ? qz.streak + 1 : 1;
      qz.last = isoToday();
    }
    qz.total = (qz.total || 0) + 1;
    if (ctx.kind === "quiz") { if (qz.mois !== isoToday().slice(0, 7)) { qz.mois = isoToday().slice(0, 7); qz.nm = 0; } qz.nm = (qz.nm || 0) + 1; }
    if (ctx.kind === "quiz" && state.plan) {
      if (!state.plan.res) { state.plan.res = []; }
      state.plan.res[state.plan.done || 0] = cur.correct + "/" + ex.qs.length;
      state.plan.done = (state.plan.done || 0) + 1;
      ensurePlan();
    }
    if (ctx.kind === "quiz") {
      if (!qz.days) { qz.days = {}; }
      var prev = qz.days[isoToday()];
      if (prev === undefined || typeof prev === "number" || cur.correct / ex.qs.length > prev.c / prev.t) { qz.days[isoToday()] = { c: cur.correct, t: ex.qs.length }; }
    }
    var enf = state.enc && state.enc[ctx.kind];
    if (enf && enf.res) {
      for (var rr = 0; rr < enf.res.length; rr++) {
        var rl = enf.res[rr][0];
        if (!state.stats[rl]) { state.stats[rl] = { n: 0, w: 0 }; }
        state.stats[rl].n++;
        if (!enf.res[rr][1]) { state.stats[rl].w++; }
      }
    }
    if (state.enc) { state.enc[ctx.kind] = null; }
  }
  if (ctx.kind === "lecon" && ctx.lid) { if (!state.exi) { state.exi = {}; } state.exi[ctx.lid] = (state.exi[ctx.lid] || 0) + 1; }
  logExercice({ id: new Date().getTime(), d: today(), h: heureNow(), k: ctx.kind, g: ctx.g, t: ex.titre, s: s, n: ex.qs.length, ok: cur.correct, qs: cur.rep || [], w: cur.written || "", qe: ex.ecrit || "" });

  if (state.history.length > 200) { state.history = state.history.slice(state.history.length - 200); }
  saveState();
  showResult(info);
}

function copyText(ta, msg) {
  var done = false;
  function fallback() {
    try {
      ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
      var ok = document.execCommand("copy");
      msg.textContent = ok ? "Copié." : "Le texte est sélectionné : appuie dessus et choisis Copier.";
    } catch (e2) {
      msg.textContent = "Le texte est sélectionné : appuie dessus et choisis Copier.";
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "Copié."; }, function () { fallback(); });
      done = true;
    }
  } catch (e) {}
  if (!done) { fallback(); }
}

function parler(text, msgEl, rate) {
  var synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined") {
    msgEl.textContent = "Cet iPad ne sait pas lire à voix haute ici.";
    return;
  }
  var t = String(text).replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
  if (!t) { msgEl.textContent = "Colle d'abord le message de ton professeur dans la case."; return; }
  synth.cancel();
  var voices = synth.getVoices ? synth.getVoices() : [];
  var fr = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang && voices[i].lang.toLowerCase().indexOf("fr") === 0) { fr = voices[i]; break; }
  }
  var parts = t.match(/[^.!?]+[.!?]*/g) || [t];
  for (var j = 0; j < parts.length; j++) {
    var p = parts[j].replace(/^\s+|\s+$/g, "");
    if (!p) { continue; }
    var u = new SpeechSynthesisUtterance(p);
    u.lang = "fr-FR";
    if (fr) { u.voice = fr; }
    u.rate = rate || 0.9;
    synth.speak(u);
  }
  msgEl.textContent = fr ? "" : "Si la voix n'est pas en français, change-la dans les réglages d'accessibilité de l'iPad (Contenu énoncé, Voix).";
}
