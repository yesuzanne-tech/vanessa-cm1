<style>
/* Plan : une page, un seul écran à la fois, gros boutons pour iPad. Palette de blocs (herbe, terre, ciel), texte très lisible. */
:root {
  --ciel: #e6f3fb;
  --herbe: #3f8f2b;
  --herbe-fonce: #2d6a1e;
  --terre: #7b5232;
  --encre: #1d2a1c;
  --papier: #ffffff;
  --or: #f1b400;
  --juste: #2e8b3d;
  --faux: #c0392b;
  --police: "Trebuchet MS", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ciel);
  color: var(--encre);
  font-family: var(--police);
  font-size: 20px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.bandeau {
  background: var(--herbe);
  border-bottom: 8px solid var(--terre);
  color: #fff;
  padding: 14px 20px;
}
.bandeau-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.titre { font-size: 26px; font-weight: bold; letter-spacing: 0.5px; margin: 0; }
.version { font-size: 13px; opacity: 0.85; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px 16px; }
.carte {
  background: var(--papier);
  border: 3px solid var(--terre);
  border-radius: 6px;
  padding: 20px;
  margin-bottom: 16px;
}
h2 { font-size: 24px; margin: 0 0 8px 0; }
p { margin: 0 0 12px 0; }
.niveaux { display: -webkit-box; display: -webkit-flex; display: flex; margin: 12px -4px; }
.bloc {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; margin: 0 4px; text-align: center; padding: 10px 4px;
  border: 3px solid var(--terre); background: #e4dccd; color: #6b5a47; font-weight: bold; border-radius: 4px;
}
.bloc.actif { background: var(--herbe); color: #fff; border-color: var(--herbe-fonce); }
.bloc.passe { background: var(--or); color: var(--encre); border-color: var(--terre); }
.bouton {
  display: block; width: 100%; font-family: var(--police); font-size: 22px; font-weight: bold;
  padding: 16px 18px; margin: 10px 0 0 0; border-radius: 6px; cursor: pointer;
  border: 3px solid var(--herbe-fonce); background: var(--herbe); color: #fff; text-align: center;
  -webkit-appearance: none; appearance: none;
}
.bouton.second { background: #fff; color: var(--herbe-fonce); }
.bouton:focus { outline: 4px solid var(--or); outline-offset: 2px; }
.option {
  display: block; width: 100%; text-align: left; font-family: var(--police); font-size: 21px;
  padding: 16px 18px; margin: 10px 0 0 0; border-radius: 6px; cursor: pointer;
  border: 3px solid var(--terre); background: #fffdf7; color: var(--encre);
  -webkit-appearance: none; appearance: none;
}
.option:focus { outline: 4px solid var(--or); outline-offset: 2px; }
.option.juste { background: #d8f0da; border-color: var(--juste); }
.option.faux { background: #f8dcd8; border-color: var(--faux); }
.texte-histoire {
  font-size: 22px; line-height: 1.65; background: #fffdf2; border-left: 8px solid var(--or);
  padding: 14px 16px; border-radius: 4px; margin: 10px 0 0 0;
}
.etiquette { display: inline-block; font-size: 15px; font-weight: bold; background: var(--terre); color: #fff; padding: 2px 10px; border-radius: 3px; }
.suivi { font-size: 16px; color: #4d5b4c; margin-bottom: 6px; }
.retour { margin-top: 14px; padding: 12px 14px; border-radius: 6px; font-size: 19px; }
.retour.ok { background: #d8f0da; border: 2px solid var(--juste); }
.retour.ko { background: #f8dcd8; border: 2px solid var(--faux); }
.note { font-size: 54px; font-weight: bold; color: var(--herbe-fonce); line-height: 1.1; margin: 4px 0 8px 0; }
.etoiles { font-size: 36px; color: var(--or); letter-spacing: 4px; margin-bottom: 6px; }
textarea {
  width: 100%; font-family: var(--police); font-size: 20px; padding: 12px; border: 3px solid var(--terre);
  border-radius: 6px; background: #fffdf7; color: var(--encre); min-height: 110px;
}
textarea:focus { outline: 4px solid var(--or); outline-offset: 2px; }
.liste { margin: 0; padding-left: 22px; font-size: 18px; }
.petit { font-size: 16px; color: #4d5b4c; }
.bilan { font-size: 15px; min-height: 280px; font-family: "Courier New", monospace; }
</style>
</head>

/* ---------- Progression ---------- */
function defaultState() {
  return { level: 1, streak: 0, pos: { "1": 0, "2": 0, "3": 0 }, history: [] };
}
function loadState() {
  try {
    var s = window.localStorage.getItem(STORE);
    if (s) {
      var o = JSON.parse(s);
      if (o && o.level && o.pos && o.history) { return o; }
    }
  } catch (e) {}
  return defaultState();
}
function saveState() {
  try { window.localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}
var state = loadState();
var cur = null;

/* ---------- Outils ---------- */
var app = document.getElementById("app");
document.getElementById("version").textContent = VERSION;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function today() {
  var d = new Date();
  var j = d.getDate(); var m = d.getMonth() + 1;
  return (j < 10 ? "0" + j : j) + "/" + (m < 10 ? "0" + m : m) + "/" + d.getFullYear();
}
function blocsNiveaux() {
  var h = '<div class="niveaux">';
  for (var i = 1; i <= LEVELS.length; i++) {
    var c = "bloc";
    if (i < state.level) { c += " passe"; }
    if (i === state.level) { c += " actif"; }
    h += '<div class="' + c + '">Niveau ' + i + '</div>';
  }
  return h + '</div>';
}
function bind(id, fn) {
  var el = document.getElementById(id);
  if (el) { el.addEventListener("click", fn); }
}
function go(html) {
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------- Écrans ---------- */
function showHome() {
  var lv = LEVELS[state.level - 1];
  var reste = 2 - state.streak;
  var h = '<div class="carte">';
  h += '<h2>Salut Vanessa !</h2>';
  h += '<p>Ta mission : lire un petit texte et répondre à 5 questions. Avec 8 sur 10 ou plus, deux fois de suite, tu montes d\'un niveau.</p>';
  h += blocsNiveaux();
  h += '<p><strong>Niveau ' + state.level + ' : ' + esc(lv.nom) + '</strong></p>';
  h += '<p class="petit">Encore ' + reste + ' réussite' + (reste > 1 ? "s" : "") + ' à 8/10 ou plus pour monter.</p>';
  h += '<button class="bouton" id="b-start">Commencer la mission</button>';
  h += '</div>';
  var n = state.history.length;
  if (n > 0) {
    h += '<div class="carte"><h2>Mes derniers résultats</h2><ul class="liste">';
    for (var i = n - 1; i >= 0 && i >= n - 3; i--) {
      var e = state.history[i];
      h += '<li>' + esc(e.t) + ' : ' + e.s + '/10</li>';
    }
    h += '</ul></div>';
  }
  h += '<button class="bouton second" id="b-bilan">Bilan pour maman</button>';
  go(h);
  bind("b-start", startExercise);
  bind("b-bilan", showBilan);
}

function startExercise() {
  var lv = LEVELS[state.level - 1];
  var idx = state.pos[String(state.level)] % lv.texts.length;
  cur = { t: lv.texts[idx], qi: 0, score: 0, wrong: [], written: "", lvl: state.level };
  showQuestion();
}

function showQuestion() {
  var t = cur.t;
  var q = t.qs[cur.qi];
  var h = '<div class="carte">';
  h += '<span class="etiquette">' + esc(t.univers) + '</span>';
  h += '<h2 style="margin-top:10px">' + esc(t.titre) + '</h2>';
  h += '<div class="texte-histoire">' + esc(t.texte) + '</div>';
  h += '</div>';
  h += '<div class="carte">';
  h += '<div class="suivi">Question ' + (cur.qi + 1) + ' sur ' + t.qs.length + '</div>';
  h += '<h2>' + esc(q.q) + '</h2>';
  for (var i = 0; i < q.o.length; i++) {
    h += '<button class="option" id="o' + i + '">' + esc(q.o[i]) + '</button>';
  }
  h += '<div id="retour"></div>';
  h += '</div>';
  go(h);
  var locked = false;
  function choose(i) {
    if (locked) { return; }
    locked = true;
    var ok = (i === q.a);
    if (ok) { cur.score += 2; } else { cur.wrong.push(cur.qi + 1); }
    for (var k = 0; k < q.o.length; k++) {
      var b = document.getElementById("o" + k);
      if (k === q.a) { b.className = "option juste"; }
      else if (k === i) { b.className = "option faux"; }
    }
    var r = document.getElementById("retour");
    var last = (cur.qi === t.qs.length - 1);
    var m;
    if (ok) {
      m = '<div class="retour ok"><strong>Bravo !</strong> ' + esc(q.why) + '</div>';
    } else {
      m = '<div class="retour ko"><strong>Pas tout à fait.</strong> Voici l\'indice dans le texte : ' + esc(q.why) + '</div>';
    }
    m += '<button class="bouton" id="b-next">' + (last ? "Continuer" : "Question suivante") + '</button>';
    r.innerHTML = m;
    bind("b-next", function () {
      if (last) { showWritten(); } else { cur.qi++; showQuestion(); }
    });
  }
  for (var j = 0; j < q.o.length; j++) {
    (function (n) { bind("o" + n, function () { choose(n); }); })(j);
  }
}

function showWritten() {
  var h = '<div class="carte">';
  h += '<h2>Dernière étape</h2>';
  h += '<p>' + esc(cur.t.ecrit) + '</p>';
  h += '<p class="petit">Fais une phrase complète : une majuscule au début et un point à la fin. Cette réponse n\'est pas notée, maman la lira.</p>';
  h += '<textarea id="ecrit" aria-label="Ta réponse"></textarea>';
  h += '<button class="bouton" id="b-fin">Terminer le texte</button>';
  h += '</div>';
  go(h);
  bind("b-fin", function () {
    cur.written = document.getElementById("ecrit").value;
    finish();
  });
}

function finish() {
  var s = cur.score;
  var avant = state.level;
  if (s >= 8) { state.streak++; } else { state.streak = 0; }
  var monte = false, termine = false;
  if (state.streak >= 2) {
    if (state.level < LEVELS.length) { state.level++; state.streak = 0; monte = true; }
    else { termine = true; }
  }
  state.pos[String(avant)] = state.pos[String(avant)] + 1;
  state.history.push({ d: today(), lvl: avant, id: cur.t.id, t: cur.t.titre, s: s, w: cur.wrong, e: cur.written });
  if (state.history.length > 60) { state.history = state.history.slice(state.history.length - 60); }
  saveState();
  showResult(s, monte, termine);
}

function showResult(s, monte, termine) {
  var etoiles = s >= 10 ? "★★★" : (s >= 8 ? "★★☆" : (s >= 6 ? "★☆☆" : "☆☆☆"));
  var msg;
  if (s >= 8) { msg = "Excellent travail !"; }
  else if (s >= 6) { msg = "C'est bien. Encore un petit effort et tu y es."; }
  else { msg = "On s'entraîne encore avec un autre texte du même niveau. Relis bien le texte avant de répondre."; }
  var h = '<div class="carte" style="text-align:center">';
  h += '<div class="etoiles">' + etoiles + '</div>';
  h += '<div class="note">' + s + ' / 10</div>';
  h += '<p>' + msg + '</p>';
  if (monte) {
    h += '<p><strong>Bravo, tu passes au niveau ' + state.level + ' : ' + esc(LEVELS[state.level - 1].nom) + ' !</strong></p>';
  } else if (termine) {
    h += '<p><strong>Tu as réussi le dernier niveau disponible.</strong> De nouveaux textes arrivent bientôt.</p>';
  } else if (s >= 8) {
    h += '<p>Encore une réussite à 8/10 ou plus pour monter d\'un niveau.</p>';
  }
  h += '<button class="bouton" id="b-suite">Texte suivant</button>';
  h += '<button class="bouton second" id="b-acc">Retour à l\'accueil</button>';
  h += '</div>';
  go(h);
  bind("b-suite", startExercise);
  bind("b-acc", showHome);
}

/* ---------- Bilan pour l'adulte ---------- */
function bilanTexte() {
  var l = [];
  l.push("BILAN LECTURE - Vanessa (" + VERSION + ")");
  l.push("Date du bilan : " + today());
  l.push("Niveau actuel : " + state.level + " (" + LEVELS[state.level - 1].nom + ")");
  l.push("Réussites de suite à 8/10 ou plus : " + state.streak + " sur 2");
  l.push("Derniers exercices :");
  var n = state.history.length;
  if (n === 0) { l.push("(aucun exercice fait pour l'instant)"); }
  for (var i = Math.max(0, n - 10); i < n; i++) {
    var e = state.history[i];
    var ligne = "- " + e.d + " | Niveau " + e.lvl + " | " + e.t + " | " + e.s + "/10";
    if (e.w && e.w.length) { ligne += " | erreurs aux questions : " + e.w.join(", "); }
    if (e.e) { ligne += " | phrase écrite : " + e.e.replace(/\s+/g, " "); }
    l.push(ligne);
  }
  return l.join("\n");
}

function showBilan() {
  var h = '<div class="carte">';
  h += '<h2>Bilan pour maman</h2>';
  h += '<p class="petit">Copie ce texte et colle-le dans la conversation avec Claude. Il prépare la prochaine version des exercices.</p>';
  h += '<textarea id="bilan" class="bilan" readonly aria-label="Bilan à copier"></textarea>';
  h += '<button class="bouton" id="b-copy">Copier le bilan</button>';
  h += '<p class="petit" id="copie-msg"></p>';
  h += '<button class="bouton second" id="b-retour">Retour</button>';
  h += '<button class="bouton second" id="b-reset">Effacer toute la progression</button>';
  h += '<div id="reset-zone"></div>';
  h += '</div>';
  go(h);
  var ta = document.getElementById("bilan");
  ta.value = bilanTexte();
  bind("b-retour", showHome);
  bind("b-copy", function () {
    var msg = document.getElementById("copie-msg");
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "Copié."; }, function () { fallback(); });
        done = true;
      }
    } catch (e) {}
    if (!done) { fallback(); }
    function fallback() {
      try {
        ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
        var ok = document.execCommand("copy");
        msg.textContent = ok ? "Copié." : "Le texte est sélectionné : appuie dessus et choisis Copier.";
      } catch (e2) {
        msg.textContent = "Le texte est sélectionné : appuie dessus et choisis Copier.";
      }
    }
  });
  bind("b-reset", function () {
    var z = document.getElementById("reset-zone");
    z.innerHTML = '<div class="retour ko"><p>Tout sera effacé : niveau, scores et phrases écrites. Cette action est définitive.</p><button class="bouton" id="b-reset-ok" style="background:#c0392b;border-color:#8e281d">Oui, tout effacer</button><button class="bouton second" id="b-reset-non">Non, garder</button></div>';
    bind("b-reset-ok", function () { state = defaultState(); saveState(); showHome(); });
    bind("b-reset-non", function () { z.innerHTML = ""; });
  });
}

showHome();
</script>
</body>
